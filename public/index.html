<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="description" content="小忆 —— 拥有长期记忆的私人 AI 伙伴" />
<link rel="icon" href="/avatar.png" />
<title>小忆</title>
<script>
  // 首屏防闪烁：按已存主题（默认跟随系统）立即设置 data-theme
  (function () {
    var m = localStorage.getItem('ds-memory-theme') || 'system';
    var dark = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #eef2f8;
    --bg-grad-1: #f7f9fd;
    --bg-grad-2: #e8eef7;
    --panel: rgba(255, 255, 255, .78);
    --panel-solid: #ffffff;
    --border: rgba(20, 35, 60, .09);
    --border-strong: rgba(20, 35, 60, .16);
    --text: #131a26;
    --text-soft: #3d4757;
    --muted: #7c8698;
    --accent: #3b7cf6;
    --accent-2: #2563eb;
    --accent-grad: linear-gradient(135deg, #4f8dff, #2563eb);
    --user-bg: linear-gradient(135deg, #4f8dff, #2f6fe8);
    --user-text: #ffffff;
    --assistant-bg: #ffffff;
    --assistant-border: rgba(20, 35, 60, .07);
    --input-bg: #ffffff;
    --input-border: rgba(20, 35, 60, .12);
    --code-bg: #f3f5f9;
    --code-border: rgba(20, 35, 60, .08);
    --quote-border: #c8d3e4;
    --quote-text: #67718a;
    --link: #2563eb;
    --chip-bg: rgba(255, 255, 255, .72);
    --chip-border: rgba(20, 35, 60, .08);
    --hover: rgba(20, 35, 60, .05);
    --shadow-sm: 0 1px 2px rgba(16, 28, 48, .05), 0 2px 8px rgba(16, 28, 48, .04);
    --shadow-md: 0 4px 16px rgba(16, 28, 48, .08), 0 1px 3px rgba(16, 28, 48, .05);
    --shadow-lg: 0 12px 40px rgba(16, 28, 48, .12);
    --error-bg: #fdeef1;
    --error-border: #f3c3cb;
    --error-text: #b3303f;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b0f16;
    --bg-grad-1: #111722;
    --bg-grad-2: #0a0e14;
    --panel: rgba(23, 30, 42, .72);
    --panel-solid: #161d28;
    --border: rgba(255, 255, 255, .07);
    --border-strong: rgba(255, 255, 255, .14);
    --text: #e8edf5;
    --text-soft: #c2ccdb;
    --muted: #8b97a9;
    --accent: #5b9bff;
    --accent-2: #3b82f6;
    --accent-grad: linear-gradient(135deg, #5b9bff, #2f6fe8);
    --user-bg: linear-gradient(135deg, #4a86e8, #2a5fc4);
    --user-text: #ffffff;
    --assistant-bg: #18202c;
    --assistant-border: rgba(255, 255, 255, .06);
    --input-bg: #1a2230;
    --input-border: rgba(255, 255, 255, .1);
    --code-bg: #0f151e;
    --code-border: rgba(255, 255, 255, .07);
    --quote-border: #38455c;
    --quote-text: #94a2b8;
    --link: #7db4ff;
    --chip-bg: rgba(255, 255, 255, .05);
    --chip-border: rgba(255, 255, 255, .08);
    --hover: rgba(255, 255, 255, .06);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
    --shadow-md: 0 4px 16px rgba(0, 0, 0, .35);
    --shadow-lg: 0 12px 40px rgba(0, 0, 0, .5);
    --error-bg: #3a1f26;
    --error-border: #6b2f3a;
    --error-text: #f5a3b0;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; height: 100dvh; display: flex; flex-direction: column;
    background: radial-gradient(1200px 600px at 20% -10%, var(--bg-grad-1), transparent),
                radial-gradient(900px 500px at 100% 0%, var(--bg-grad-1), transparent),
                var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ---------- 顶栏 ---------- */
  header {
    display: flex; align-items: center; gap: 1rem;
    padding: .7rem 1.25rem;
    background: var(--panel);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 5;
  }
  .brand { display: flex; align-items: center; gap: .65rem; min-width: 0; }
  .avatar-wrap {
    position: relative; width: 38px; height: 38px; flex: 0 0 auto;
    border-radius: 50%; overflow: hidden;
    background: var(--accent-grad);
    box-shadow: 0 2px 10px rgba(59, 124, 246, .35);
    display: flex; align-items: center; justify-content: center;
  }
  .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #avatarFallback { font-size: 1.15rem; line-height: 1; }
  .brand-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  header h1 {
    font-size: 1.02rem; margin: 0; font-weight: 650; letter-spacing: .01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .status { display: inline-flex; align-items: center; gap: .3rem; font-size: .7rem; color: var(--muted); }
  .status .dot {
    width: 6px; height: 6px; border-radius: 50%; background: #22c55e;
    box-shadow: 0 0 0 2px rgba(34, 197, 94, .18);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

  .meta { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; min-width: 0; }
  .chip {
    font-size: .73rem; color: var(--muted);
    background: var(--chip-bg); border: 1px solid var(--chip-border);
    padding: .18rem .55rem; border-radius: 999px; white-space: nowrap;
    transition: background .15s ease, color .15s ease;
  }
  #usageInfo, #balanceInfo { cursor: pointer; }
  #usageInfo:hover, #balanceInfo:hover { color: var(--text-soft); background: var(--hover); }

  .actions { display: flex; align-items: center; gap: .4rem; margin-left: auto; flex: 0 0 auto; }
  .actions button {
    background: transparent; border: 1px solid var(--chip-border); color: var(--text-soft);
    border-radius: 9px; padding: .34rem .62rem; cursor: pointer; font-size: .78rem;
    transition: background .15s ease, border-color .15s ease, transform .1s ease;
    touch-action: manipulation; white-space: nowrap;
  }
  .actions button:hover { background: var(--hover); border-color: var(--border-strong); }
  .actions button:active { transform: scale(.96); }
  #logout { color: var(--muted); }

  /* ---------- 消息区 ---------- */
  #messages {
    flex: 1; overflow-y: auto; padding: 1.4rem clamp(.9rem, 4vw, 2rem) 1rem;
    display: flex; flex-direction: column; gap: 1.05rem;
    overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
    scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent;
  }
  #messages::-webkit-scrollbar { width: 8px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }

  .msg {
    display: flex; gap: .55rem; align-items: flex-start;
    max-width: min(860px, 100%); margin: 0 auto; width: 100%;
    animation: rise .26s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg.user { flex-direction: row-reverse; }
  .msg-avatar {
    width: 30px; height: 30px; border-radius: 50%; flex: 0 0 auto; margin-top: 2px;
    background: var(--accent-grad); overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: .95rem; box-shadow: 0 1px 4px rgba(16, 28, 48, .12);
  }
  .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .msg.user .msg-avatar { background: linear-gradient(135deg, #9aa8bd, #6f7f96); overflow: hidden; }
  .msg.user .msg-avatar img { image-rendering: pixelated; }
  .msg-body { display: flex; flex-direction: column; min-width: 0; max-width: 78%; }
  .msg.user .msg-body { align-items: flex-end; }

  .bubble {
    padding: .68rem .95rem; border-radius: 16px; line-height: 1.68;
    font-size: .94rem; white-space: normal; overflow-wrap: anywhere;
    box-shadow: var(--shadow-sm);
  }
  .msg.user .bubble {
    background: var(--user-bg); color: var(--user-text);
    border-bottom-right-radius: 6px;
    box-shadow: 0 2px 12px rgba(47, 111, 232, .28);
  }
  .msg.assistant .bubble {
    background: var(--assistant-bg); color: var(--text);
    border: 1px solid var(--assistant-border);
    border-bottom-left-radius: 6px;
  }
  .msg.error .bubble { background: var(--error-bg); border: 1px solid var(--error-border); color: var(--error-text); }
  .msg-file {
    margin-top: .45rem; font-size: .82rem; color: var(--text-soft);
    background: var(--code-bg); border: 1px solid var(--code-border);
    border-radius: 8px; padding: .3rem .6rem; display: inline-block;
  }
  /* ★ 活人感：正在输入的三点跳动动画 */
  .typing { color: var(--text-muted, #888); font-size: .9rem; }
  .typing .dot { display: inline-block; animation: typing-blink 1.4s infinite; }
  @keyframes typing-blink {
    0%, 60%, 100% { opacity: .25; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-2px); }
  }
  .bubble p { margin: .38em 0; }
  .bubble p:first-child { margin-top: 0; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble pre {
    background: var(--code-bg); border: 1px solid var(--code-border); border-radius: 10px;
    padding: .75em .9em; overflow-x: auto; font-size: .84rem; line-height: 1.55;
  }
  .bubble code { background: var(--code-bg); border-radius: 5px; padding: .12em .38em; font-size: .87em; }
  .bubble pre code { background: none; padding: 0; }
  .bubble blockquote { border-left: 3px solid var(--quote-border); margin: .45em 0; padding-left: .85em; color: var(--quote-text); }
  .bubble a { color: var(--link); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--link) 35%, transparent); }
  .bubble a:hover { border-bottom-color: var(--link); }
  .bubble h1, .bubble h2, .bubble h3, .bubble h4 { font-size: 1em; margin: .6em 0 .25em; font-weight: 650; }
  .bubble hr { border: none; border-top: 1px solid var(--border); margin: .7em 0; }
  .bubble img.msg-img { max-width: 100%; max-height: 320px; border-radius: 10px; margin-top: .5rem; display: block; object-fit: contain; }
  .img-missing {
    display: inline-block; font-size: .78rem; color: var(--muted);
    background: var(--chip-bg); border: 1px dashed var(--border-strong);
    padding: .1rem .45rem; border-radius: 6px; margin-top: .25rem;
  }

  .msg-foot { display: flex; align-items: center; gap: .45rem; margin-top: .3rem; padding: 0 .2rem; }
  .cost-tag { font-size: .7rem; color: var(--muted); }
  .copy-btn {
    background: none; border: none; color: var(--muted); font-size: .7rem;
    cursor: pointer; padding: .1rem .25rem; border-radius: 5px; opacity: 0; transition: opacity .15s ease;
  }
  .msg:hover .copy-btn, .copy-btn:focus-visible { opacity: 1; }
  .copy-btn:hover { color: var(--text-soft); background: var(--hover); }

  /* ---------- 输入区 ---------- */
  #composer {
    padding: .85rem clamp(.9rem, 4vw, 2rem) calc(.95rem + env(safe-area-inset-bottom, 0px));
    background: var(--panel);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border-top: 1px solid var(--border);
  }
  .composer-inner {
    display: flex; gap: .55rem; max-width: 860px; margin: 0 auto; align-items: flex-end;
  }
  #preview {
    max-width: 860px; margin: 0 auto .6rem; display: flex; gap: .5rem; align-items: flex-start;
  }
  #preview img { max-height: 110px; max-width: 40vw; border-radius: 10px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
  #removeImg {
    border: 1px solid var(--border-strong); background: var(--panel-solid); color: var(--text-soft);
    border-radius: 50%; width: 26px; height: 26px; cursor: pointer; line-height: 1; flex: 0 0 auto;
    transition: background .15s ease;
  }
  #removeImg:hover { background: var(--hover); }

  #filePreview {
    max-width: 860px; margin: 0 auto .6rem; display: flex; gap: .5rem; align-items: center;
  }
  #filePreviewName {
    font-size: .86rem; color: var(--text-soft); background: var(--panel-solid);
    border: 1px solid var(--border); border-radius: 10px; padding: .4rem .75rem;
    max-width: 70vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #removeFile {
    border: 1px solid var(--border-strong); background: var(--panel-solid); color: var(--text-soft);
    border-radius: 50%; width: 26px; height: 26px; cursor: pointer; line-height: 1; flex: 0 0 auto;
    transition: background .15s ease;
  }
  #removeFile:hover { background: var(--hover); }

  #pickImage, #pickFile {
    border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-soft);
    border-radius: 13px; width: 44px; height: 44px; cursor: pointer; font-size: 1.05rem;
    line-height: 1; flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
    transition: background .15s ease, border-color .15s ease, transform .1s ease;
    touch-action: manipulation;
  }
  #pickImage:hover, #pickFile:hover { background: var(--hover); border-color: var(--border-strong); }
  #pickImage:active, #pickFile:active { transform: scale(.95); }

  #input {
    flex: 1; resize: none; min-height: 44px; max-height: 10rem; padding: .68rem .95rem;
    background: var(--input-bg); color: var(--text);
    border: 1px solid var(--input-border); border-radius: 13px;
    font: inherit; font-size: .94rem; line-height: 1.5; outline: none;
    box-shadow: var(--shadow-sm);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  #input::placeholder { color: var(--muted); }
  #input:focus {
    border-color: color-mix(in srgb, var(--accent) 60%, transparent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent);
  }
  #send {
    border: none; background: var(--accent-grad); color: #fff; border-radius: 13px;
    padding: 0 1.35rem; height: 44px; cursor: pointer; font: inherit; font-size: .92rem; font-weight: 550;
    flex: 0 0 auto; box-shadow: 0 2px 10px rgba(47, 111, 232, .3);
    transition: filter .15s ease, transform .1s ease;
    touch-action: manipulation;
  }
  #send:hover:not(:disabled) { filter: brightness(1.06); }
  #send:active:not(:disabled) { transform: scale(.97); }
  #send:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }

  /* ---------- 登录 ---------- */
  #login {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(900px 500px at 30% 10%, var(--bg-grad-1), transparent), var(--bg);
    z-index: 20; padding: 1rem;
  }
  #login .card {
    background: var(--panel-solid); border: 1px solid var(--border); border-radius: 18px;
    padding: 2.1rem 1.9rem; width: min(92vw, 350px); box-shadow: var(--shadow-lg);
    text-align: center;
  }
  #login .card .avatar-wrap { width: 56px; height: 56px; margin: 0 auto .9rem; font-size: 1.6rem; }
  #login h2 { margin: 0 0 1.3rem; font-size: 1.02rem; font-weight: 600; color: var(--text-soft); letter-spacing: .02em; }
  #password {
    width: 100%; padding: .68rem .9rem; background: var(--input-bg); color: var(--text);
    border: 1px solid var(--input-border); border-radius: 11px; font: inherit; outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  #password:focus {
    border-color: color-mix(in srgb, var(--accent) 60%, transparent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent);
  }
  #loginBtn {
    width: 100%; margin-top: .85rem; padding: .68rem; background: var(--accent-grad); color: #fff;
    border: none; border-radius: 11px; cursor: pointer; font: inherit; font-weight: 550;
    box-shadow: 0 2px 10px rgba(47, 111, 232, .3);
    transition: filter .15s ease, transform .1s ease;
    touch-action: manipulation;
  }
  #loginBtn:hover { filter: brightness(1.06); }
  #loginBtn:active { transform: scale(.98); }
  #loginError { color: var(--error-text); font-size: .82rem; min-height: 1.2em; margin-top: .6rem; }
  .hidden { display: none !important; }

  /* ---------- 手机端 ---------- */
  @media (max-width: 680px) {
    header { flex-wrap: wrap; gap: .5rem .6rem; padding: .55rem .8rem; }
    .avatar-wrap { width: 34px; height: 34px; }
    header h1 { font-size: .96rem; }
    .meta { order: 3; flex-basis: 100%; gap: .35rem; overflow-x: auto; scrollbar-width: none; }
    .meta::-webkit-scrollbar { display: none; }
    .chip { font-size: .69rem; padding: .16rem .48rem; }
    .actions { gap: .3rem; }
    .actions button { padding: .28rem .48rem; font-size: .72rem; }
    #messages { padding: .9rem .7rem .6rem; gap: .8rem; }
    .msg-body { max-width: 84%; }
    .bubble { font-size: .92rem; padding: .6rem .82rem; border-radius: 14px; }
    .msg-avatar { width: 26px; height: 26px; font-size: .82rem; }
    .copy-btn { opacity: 1; }
    #composer { padding: .6rem .7rem calc(.7rem + env(safe-area-inset-bottom, 0px)); }
    #input { font-size: 16px; min-height: 42px; }
    #send { height: 42px; padding: 0 1.05rem; }
    #pickImage { width: 42px; height: 42px; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="avatar-wrap">
        <img id="avatarImg" src="/avatar.png" alt="小忆"
             onerror="this.style.display='none';document.getElementById('avatarFallback').style.display='flex'" />
        <span id="avatarFallback" style="display:none">🐟</span>
      </div>
      <div class="brand-text">
        <h1>小忆</h1>
        <span class="status"><i class="dot"></i>在线</span>
      </div>
    </div>
    <div class="meta">
      <span id="dayInfo" class="chip"></span>
      <span id="usageInfo" class="chip" title="点击查看最近 7 天费用明细"></span>
      <span id="balanceInfo" class="chip" title="DeepSeek 账户余额"></span>
    </div>
    <div class="actions">
      <button id="themeBtn" title="切换主题（跟随系统 / 深色 / 浅色）">🎨</button>
      <button id="setCity" title="修改天气城市">📍 城市</button>
      <button id="runDaily" title="立即归档昨天并提炼记忆">⚡ 归档</button>
      <button id="logout">退出</button>
    </div>
  </header>

  <main id="messages"></main>

  <footer id="composer">
    <div id="preview" class="hidden">
      <img id="previewImg" alt="待发送图片" />
      <button id="removeImg" type="button" title="移除图片">✕</button>
    </div>
    <div id="filePreview" class="hidden">
      <span id="filePreviewName">文件</span>
      <button id="removeFile" type="button" title="移除文件">✕</button>
    </div>
    <div class="composer-inner">
      <button id="pickImage" type="button" title="发送图片">📷</button>
      <button id="pickFile" type="button" title="发送文件">📄</button>
      <textarea id="input" rows="1" placeholder="说点什么…"></textarea>
      <button id="send">发送</button>
    </div>
    <input id="fileInput" type="file" accept="image/*" hidden />
    <input id="docInput" type="file" accept=".txt,.md,.markdown,.json,.log,.csv,.yml,.yaml,.toml,.ini,.conf,.xml,.html,.css,.js,.ts,.jsx,.tsx,.py,.c,.h,.cpp,.java,.go,.rs,.sql,.sh,.pdf,.docx,.xlsx,.pptx" hidden />
  </footer>

  <div id="login">
    <div class="card">
      <div class="avatar-wrap">
        <img id="loginAvatar" src="/avatar.png" alt="小忆"
             onerror="this.style.display='none';document.getElementById('loginAvatarFallback').style.display='flex'" />
        <span id="loginAvatarFallback" style="display:none">🐟</span>
      </div>
      <h2>输入口令，和小忆聊天</h2>
      <form id="loginForm">
        <input id="password" type="password" placeholder="访问口令" autocomplete="current-password" />
        <button id="loginBtn" type="submit">进入</button>
        <div id="loginError"></div>
      </form>
    </div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const messagesEl = $('messages');

/* ---------- 主题（跟随系统 / 深色 / 浅色，默认跟随系统） ---------- */
const THEME_KEY = 'ds-memory-theme';
const themeBtn = $('themeBtn');
const currentThemeMode = () => localStorage.getItem(THEME_KEY) || 'system';
const resolveTheme = (mode) =>
  mode === 'dark' ? 'dark'
  : mode === 'light' ? 'light'
  : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
const THEME_LABELS = { system: '🎨', dark: '🌙', light: '☀️' };
const THEME_TITLES = { system: '主题：跟随系统', dark: '主题：深色', light: '主题：浅色' };
function applyTheme(mode) {
  document.documentElement.dataset.theme = resolveTheme(mode);
  themeBtn.textContent = THEME_LABELS[mode] || '🎨';
  themeBtn.title = THEME_TITLES[mode] || '切换主题';
  localStorage.setItem(THEME_KEY, mode);
}
themeBtn.addEventListener('click', () => {
  const next = { system: 'dark', dark: 'light', light: 'system' }[currentThemeMode()] || 'system';
  applyTheme(next);
});
applyTheme(currentThemeMode());

/* ---------- 基础工具 ---------- */
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function inline(s) {
  return s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}
function renderMarkdown(src) {
  const blocks = [];
  let s = escapeHtml(src);
  s = s.replace(/```([\s\S]*?)```/g, (_, code) => {
    blocks.push('<pre><code>' + code.trim() + '</code></pre>');
    return '\u0000' + (blocks.length - 1) + '\u0000';
  });
  const out = [];
  let para = [];
  const flush = () => { if (para.length) { out.push('<p>' + para.join('<br>') + '</p>'); para = []; } };
  for (const rawLine of s.split('\n')) {
    const t = rawLine.trim();
    if (/^\u0000\d+\u0000$/.test(t)) { flush(); out.push(t); continue; }
    let m;
    if ((m = t.match(/^(#{1,4})\s+(.*)$/))) { flush(); out.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'); continue; }
    if ((m = t.match(/^&gt;\s?(.*)$/))) { flush(); out.push('<blockquote>' + inline(m[1]) + '</blockquote>'); continue; }
    if (/^[-*]\s+/.test(t)) { flush(); out.push('<p>• ' + inline(t.replace(/^[-*]\s+/, '')) + '</p>'); continue; }
    if (/^(---|\*\*\*|\* \* \*)$/.test(t)) { flush(); out.push('<hr>'); continue; }
    if (t === '') { flush(); continue; }
    para.push(inline(t));
  }
  flush();
  s = out.join('\n');
  s = s.replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[+i]);
  return s;
}

function buildBubbleEl(role, html, raw) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;

  // 头像：助手 = 小忆，用户 = 像素风头像
  const av = document.createElement('div');

  const avatarSrc = role === 'assistant' || role === 'error' ? '/avatar.png' : '/user-avatar.png';
  const img = document.createElement('img');
  img.src = avatarSrc;
  img.alt = '';
  img.onerror = () => {
    img.remove();
    av.textContent = role === 'user' ? '我' : '🐟';
    if (role === 'user') {
      av.style.fontSize = '.78rem';
      av.style.color = '#fff';
    }
  };
  av.appendChild(img);
  wrap.appendChild(av);

  const body = document.createElement('div');
  body.className = 'msg-body';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = html;
  if (raw != null) bubble.dataset.raw = raw;
  body.appendChild(bubble);

  const foot = document.createElement('div');
  foot.className = 'msg-foot';
  const btn = document.createElement('button');
  btn.className = 'copy-btn';
  btn.textContent = '复制';
  btn.addEventListener('click', async () => {
    const text = bubble.dataset.raw || bubble.textContent || '';
    try {
      await navigator.clipboard.writeText(text);
      btn.textContent = '已复制';
      setTimeout(() => { btn.textContent = '复制'; }, 1500);
    } catch { /* 剪贴板不可用则忽略 */ }
  });
  foot.appendChild(btn);
  body.appendChild(foot);

  wrap.appendChild(body);
  return wrap;
}

/* 用户消息渲染：处理 [图片:images/…] 标记与换行；无路径的 [图片] 显示占位提示 */
function renderUserContent(content) {
  const re = /\[图片:(images\/[^\]\s]+)\]/g;
  let html = '';
  let last = 0;
  let m;
  while ((m = re.exec(content))) {
    html += escapeHtml(content.slice(last, m.index));
    html += '<img class="msg-img" src="/api/image/' + m[1] + '" alt="图片" loading="lazy"'
          + ' onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{className:\'img-missing\',textContent:\'[图片加载失败]\'}))">';
    last = m.index + m[0].length;
  }
  html += escapeHtml(content.slice(last));
  // 兼容旧记录：只有 [图片] 没有 R2 路径时，显示灰色提示而不是裸露的方括号文字
  html = html.replace(/\[图片\]/g, '<span class="img-missing">[图片未存档]</span>');
  return html.replace(/\n/g, '<br>');
}

/* ---------- 历史全量回放（分页 + 上滑自动加载；记录在 D1，跨浏览器同步） ---------- */
let nextBefore = null;
let hasMore = false;
let loadingHistory = false;
/** 当前页面已渲染的最大消息 id（实时轮询的游标） */
let latestSeenId = 0;

async function fetchHistoryPage(beforeId) {
  const res = await fetch('/api/history?limit=50' + (beforeId ? `&before_id=${beforeId}` : ''));
  if (res.status === 401) { showLogin(); return null; }
  return res.json();
}

async function loadMoreHistory(jumpToBottom) {
  if (loadingHistory) return;
  loadingHistory = true;
  try {
    const data = await fetchHistoryPage(nextBefore);
    if (!data) return;
    nextBefore = data.next_before_id ?? null;
    hasMore = data.has_more ?? false;
    const frag = document.createDocumentFragment();
    for (const m of data.messages || []) {
      frag.appendChild(buildBubbleEl(
        m.role === 'user' ? 'user' : 'assistant',
        m.role === 'user' ? renderUserContent(m.content) : renderMarkdown(m.content),
        m.content,
      ));
      if (Number.isFinite(m.id) && m.id > latestSeenId) latestSeenId = m.id;
    }
    const prevHeight = messagesEl.scrollHeight;
    messagesEl.prepend(frag);
    if (jumpToBottom) {
      messagesEl.scrollTop = messagesEl.scrollHeight; // 首次加载定位到最新
    } else {
      messagesEl.scrollTop += messagesEl.scrollHeight - prevHeight; // 上滑加载保持视口不跳
    }
  } catch { /* 网络异常忽略，可继续滚动重试 */ }
  finally {
    loadingHistory = false;
  }
}

async function resetAndLoadHistory() {
  messagesEl.innerHTML = '';
  nextBefore = null;
  hasMore = false;
  latestSeenId = 0;
  await loadMoreHistory(true);
}

/* ---------- 实时刷新：定时增量拉取（让 QQ / 其它渠道的消息即时出现）---------- */
const POLL_INTERVAL_MS = 3000;
let pollTimer = null;
let pollingNow = false;
let sending = false;

async function pollNewMessages() {
  if (pollingNow) return;
  // 正在发消息/流式中：这一轮还没拿到真实 id，拉取会把刚发出的两条再渲染一遍
  if (sending) return;
  if (document.visibilityState === 'hidden') return; // 后台标签页不轮询
  pollingNow = true;
  try {
    const res = await fetch(`/api/history/since?after_id=${latestSeenId}&limit=50`);
    if (res.status === 401) { showLogin(); return; }
    if (!res.ok) return;
    const data = await res.json();
    const incoming = (data.messages || []).filter((m) => Number.isFinite(m.id) && m.id > latestSeenId);
    if (incoming.length === 0) return;

    // 先推进游标，避免重复渲染
    for (const m of incoming) {
      if (m.id > latestSeenId) latestSeenId = m.id;
    }

    // 贴底才自动滚，否则别打断正在看历史的用户
    const nearBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 120;

    for (const m of incoming) {
      messagesEl.appendChild(buildBubbleEl(
        m.role === 'user' ? 'user' : 'assistant',
        m.role === 'user' ? renderUserContent(m.content) : renderMarkdown(m.content),
        m.content,
      ));
    }
    if (nearBottom) scrollToBottom();
  } catch { /* 网络抖动忽略，下次再试 */ }
  finally {
    pollingNow = false;
  }
}

function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(pollNewMessages, POLL_INTERVAL_MS);
}

/* ---------- 文件解析（按需动态加载解析库，正常聊天不受影响） ---------- */

const LEGACY_OFFICE_EXT = ['.doc', '.xls', '.ppt'];

function extOf(name) {
  const i = String(name || '').lastIndexOf('.');
  return i < 0 ? '' : String(name).slice(i).toLowerCase();
}

/** 动态加载外部脚本，同一个 URL 只加载一次；支持多个候选源自动回退，返回成功加载的 URL。 */
const _scriptCache = {};
function loadScript(urls) {
  const list = Array.isArray(urls) ? urls : [urls];
  const key = list[0];
  if (_scriptCache[key]) return _scriptCache[key];
  const tryLoad = (i) => {
    if (i >= list.length) {
      return Promise.reject(new Error('解析库加载失败（网络/CDN 问题），可改用 QQ 端发这个文件'));
    }
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = list[i];
      s.async = true;
      s.onload = () => resolve(list[i]);
      s.onerror = () => reject(new Error('fail'));
      document.head.appendChild(s);
    }).catch(() => tryLoad(i + 1));
  };
  _scriptCache[key] = tryLoad(0);
  return _scriptCache[key];
}

const CDN = {
  pdf: [
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',
    'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js',
  ],
  mammoth: [
    'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js',
    'https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js',
  ],
  xlsx: [
    'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
    'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js',
  ],
  jszip: [
    'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',
    'https://unpkg.com/jszip@3.10.1/dist/jszip.min.js',
  ],
};

/** PDF：逐页提取文字（最多 40 页，防超长）。 */
async function parsePdf(file) {
  const loadedUrl = await loadScript(CDN.pdf);
  const pdfjs = window.pdfjsLib;
  if (!pdfjs) throw new Error('PDF 解析库未就绪');
  // worker 与主库同源，避免跨域/源失效
  pdfjs.GlobalWorkerOptions.workerSrc = String(loadedUrl).replace(/pdf\.min\.js$/, 'pdf.worker.min.js');
  const buf = await file.arrayBuffer();
  const pdf = await pdfjs.getDocument({ data: buf }).promise;
  const parts = [];
  const maxPages = Math.min(pdf.numPages, 40);
  for (let i = 1; i <= maxPages; i++) {
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    const t = tc.items.map((x) => x.str).join(' ').replace(/\s+/g, ' ').trim();
    if (t) parts.push('## 第 ' + i + ' 页\n' + t);
    if (parts.join('\n').length > 30000) { parts.push('…（页数较多，已截断）'); break; }
  }
  if (pdf.numPages > maxPages) parts.push('…（共 ' + pdf.numPages + ' 页，只解析了前 ' + maxPages + ' 页）');
  if (!parts.length) throw new Error('PDF 里没有可提取的文字（可能是扫描件/图片型 PDF）');
  return parts.join('\n\n');
}

/** Word(.docx)：提取纯文本（含表格会转成普通文本行）。 */
async function parseDocx(file) {
  await loadScript(CDN.mammoth);
  if (!window.mammoth) throw new Error('Word 解析库未就绪');
  const buf = await file.arrayBuffer();
  const res = await window.mammoth.extractRawText({ arrayBuffer: buf });
  return String(res.value || '').trim();
}

/** Excel(.xlsx)：每个工作表转 CSV 文本。 */
async function parseXlsx(file) {
  await loadScript(CDN.xlsx);
  const XLSX = window.XLSX;
  if (!XLSX) throw new Error('Excel 解析库未就绪');
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array' });
  const parts = [];
  for (const name of wb.SheetNames) {
    const ws = wb.Sheets[name];
    const csv = XLSX.utils.sheet_to_csv(ws, { blankrows: false });
    if (csv && csv.trim()) parts.push('## 工作表：' + name + '\n' + csv.trim());
  }
  if (!parts.length) throw new Error('Excel 表格里没有数据');
  return parts.join('\n\n');
}

/** PPT(.pptx)：解压 zip，从每页 XML 里抽 <a:t> 文本。 */
async function parsePptx(file) {
  await loadScript(CDN.jszip);
  const JSZip = window.JSZip;
  if (!JSZip) throw new Error('PPT 解析库未就绪');
  const buf = await file.arrayBuffer();
  const zip = await JSZip.loadAsync(buf);
  const slideNames = Object.keys(zip.files)
    .filter((n) => /^ppt\/slides\/slide\d+\.xml$/.test(n))
    .sort((a, b) => {
      const na = Number((a.match(/slide(\d+)/) || [])[1] || 0);
      const nb = Number((b.match(/slide(\d+)/) || [])[1] || 0);
      return na - nb;
    });
  if (!slideNames.length) throw new Error('PPT 结构异常，没找到幻灯片');
  const decodeXml = (s) =>
    String(s)
      .replace(/&lt;/g, '<').replace(/&gt;/g, '>')
      .replace(/&quot;/g, '"').replace(/&apos;/g, "'")
      .replace(/&amp;/g, '&');
  const parts = [];
  for (let i = 0; i < slideNames.length; i++) {
    const xml = await zip.file(slideNames[i]).async('string');
    const texts = [];
    const re = /<a:t>([\s\S]*?)<\/a:t>/g;
    let m;
    while ((m = re.exec(xml)) !== null) {
      const t = decodeXml(m[1]).trim();
      if (t) texts.push(t);
    }
    if (texts.length) parts.push('## 第 ' + (i + 1) + ' 页\n' + texts.join('\n'));
  }
  if (!parts.length) throw new Error('PPT 里没有文字内容');
  return parts.join('\n\n');
}

/** 统一入口：按扩展名分派解析方式。 */
async function extractFileText(file) {
  const ext = extOf(file.name);
  if (LEGACY_OFFICE_EXT.includes(ext)) {
    throw new Error('旧版 Office 格式（' + ext + '）暂不支持，请在 Office/WPS 里另存为 ' + ext + 'x 后再传');
  }
  if (ext === '.pdf') return await parsePdf(file);
  if (ext === '.docx') return await parseDocx(file);
  if (ext === '.xlsx') return await parseXlsx(file);
  if (ext === '.pptx') return await parsePptx(file);
  // 其余按纯文本读
  const text = await readFileAsText(file);
  if (text.indexOf('\u0000') !== -1) throw new Error('看起来是二进制文件，不支持直接读取');
  return text;
}

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error('读取文件失败'));
    r.readAsDataURL(file);
  });
}

/** 压缩图片：最长边 1024px、JPEG 0.72，尽可能压小（R2 存储省空间、上传更快）。 */
async function compressImage(file) {
  const dataUrl = await readFileAsDataUrl(file);
  const img = await new Promise((resolve, reject) => {
    const i = new Image();
    i.onload = () => resolve(i);
    i.onerror = () => reject(new Error('图片解析失败'));
    i.src = dataUrl;
  });
  const maxSide = 1024;
  let { width, height } = img;
  if (Math.max(width, height) > maxSide) {
    const k = maxSide / Math.max(width, height);
    width = Math.round(width * k);
    height = Math.round(height * k);
  }
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  canvas.getContext('2d').drawImage(img, 0, 0, width, height);
  return canvas.toDataURL('image/jpeg', 0.72);
}

async function send() {
  const content = input.value.trim();
  const image = pendingImage;
  const file = pendingFile;
  if ((!content && !image && !file) || sending) return;
  sending = true;
  $('send').disabled = true;
  input.value = '';
  input.style.height = 'auto';
  if (image) {
    pendingImage = null;
    $('preview').classList.add('hidden');
    $('previewImg').src = '';
  }
  if (file) {
    pendingFile = null;
    $('filePreview').classList.add('hidden');
    $('filePreviewName').textContent = '';
  }

  // 文件内容拼成一段「文件原文」，让 AI 能读到；图片仍走视觉
  let sendContent = content;
  if (file) {
    const fileBlock = `【文件：${file.name}】\n\`\`\`\n${file.text}\n\`\`\``;
    sendContent = content ? `${content}\n\n${fileBlock}` : fileBlock;
  }

  const userHtml = escapeHtml(content)
    + (image ? `<img class="msg-img" src="${image}" alt="图片">` : '')
    + (file ? `<div class="msg-file">📄 ${escapeHtml(file.name)}</div>` : '');
  addBubble('user', userHtml, sendContent + (image ? '\n[图片]' : ''));
  // ★ 活人感：先显示"正在输入…"，再开始流式，模拟思考停顿
  let bubble = addBubble('assistant', '<span class="typing">正在输入<span class="dot">…</span></span>', '');
  let text = '';
  let firstToken = false; // 是否已收到首字
  let frame = 0;
  // ★ 阅读+反应时延：按消息长度估算"它看完要多久"，让首字不闪现，更像它在想
  const thinkMs = Math.min(1800, 400 + sendContent.length * 30);
  const thinkDoneAt = Date.now() + thinkMs;
  const repaint = () => {
    if (frame) return;
    frame = requestAnimationFrame(() => {
      frame = 0;
      bubble.innerHTML = renderMarkdown(text) || (firstToken ? '' : '<span class="typing">正在输入<span class="dot">…</span></span>');
      bubble.dataset.raw = text;
      scrollToBottom();
    });
  };

  try {
    const res = await fetch('/api/chat', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify(image ? { content: sendContent, image } : { content: sendContent }),
    });
    if (res.status === 401) { showLogin(); throw new Error('登录已过期'); }
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || '请求失败（' + res.status + '）');
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop() || '';
      for (const line of lines) {
        const t = line.trim();
        if (!t.startsWith('data:')) continue;
        const payload = t.slice(5).trim();
        if (!payload) continue;
        if (payload === '[DONE]') continue;
        try {
          const parsed = JSON.parse(payload);
          if (parsed.event === 'usage') {
            // ★ 推进轮询游标：这一轮已经由流式渲染过了，否则 3 秒后的增量拉取会重复渲染
            if (parsed.ids) {
              const id = Number(parsed.ids.assistant || parsed.ids.user || 0);
              if (Number.isFinite(id) && id > latestSeenId) latestSeenId = id;
            }
            const tag = document.createElement('span');
            tag.className = 'cost-tag';
            tag.textContent = '≈¥' + Number(parsed.cost_rmb || 0).toFixed(4);
            const foot = bubble.parentElement.querySelector('.msg-foot');
            foot.insertBefore(tag, foot.firstChild);
            loadUsage();
            continue;
          }
          const delta = parsed.choices && parsed.choices[0] && parsed.choices[0].delta;
          if (delta && typeof delta.content === 'string') {
            firstToken = true;
            text += delta.content;
            // 首字前若有"思考停顿"，等够时间再刷出，否则直接刷
            if (Date.now() >= thinkDoneAt) {
              repaint();
            } else {
              clearTimeout(window.__typingTimer);
              window.__typingTimer = setTimeout(repaint, thinkDoneAt - Date.now());
            }
          }
        } catch { /* 忽略 */ }
      }
    }
  } catch (err) {
    bubble.className = 'bubble';
    bubble.parentElement.parentElement.className = 'msg error';
    bubble.innerHTML = '⚠️ ' + escapeHtml(String(err.message || err));
  } finally {
    sending = false;
    $('send').disabled = false;
    input.focus();
    // 流结束后补一次拉取，兼顾这期间从 QQ 发来的消息
    pollNewMessages();
  }
}

/* ---------- 会话恢复：有有效 Cookie（7 天内）自动免登录 ---------- */
async function initSession() {
  try {
    const res = await fetch('/api/history?limit=5');
    if (res.ok) {
      hideLogin();
      await loadDay();
      await resetAndLoadHistory();
      loadUsage();
      loadBalance();
      startPolling();
      input.focus();
      return;
    }
  } catch { /* 网络异常按未登录处理 */ }
  showLogin();
}
initSession();
