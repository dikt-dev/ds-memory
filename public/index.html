<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="description" content="小忆 —— 拥有长期记忆的私人 AI 伙伴" />
<link rel="icon" type="image/png" sizes="64x64" href="/icon-64.png" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<link rel="mask-icon" href="/icon-64.png" color="#4b3fd1" />
<meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0e0e10" media="(prefers-color-scheme: dark)" />
<title>小忆</title>
<script>
  // 首屏防闪烁：按已存主题（默认跟随系统）立即设置 data-theme
  (function () {
    var m = localStorage.getItem('ds-memory-theme') || 'system';
    var dark = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
<style>
  :root {
    color-scheme: light;
    /* 纸墨 · 网页版：与 DS-Mobile 共用一套色板，网页只把「纸」铺得更宽 */
    --canvas: #f7f6f3;
    --surface: #ffffff;
    --surface-muted: #f1f0eb;
    --surface-sunken: #e9e7e1;
    --ink: #17171a;
    --ink-2: #5e5b54;
    --ink-3: #706c63;
    --hairline: #e6e3dc;
    --hairline-strong: #d8d4ca;
    --accent: #4b3fd1;
    --accent-ink: #ffffff;
    --accent-soft: #edeafb;
    --user-bubble: #4b3fd1;
    --user-text: #ffffff;
    --ai-bubble: #ffffff;
    --danger: #b3261e;
    --danger-soft: #fbeeec;
    --success: #1b7a4b;
    --warning: #8a5a00;
    --code-bg: #f3f1ec;
    --code-border: #e6e3dc;
    --link: #4b3fd1;
    --quote-border: #d8d4ca;
    --quote-text: #706c63;
    --hover: rgba(23, 23, 26, .05);
    --ring: 0 0 0 3px rgba(75, 63, 209, .16);
    --col: 820px;

    /* 旧变量名保留：脚本/内联样式里可能还在引用 */
    --bg: var(--canvas);
    --panel: var(--surface);
    --panel-solid: var(--surface);
    --border: var(--hairline);
    --border-strong: var(--hairline-strong);
    --text: var(--ink);
    --text-soft: var(--ink-2);
    --muted: var(--ink-3);
    --error-bg: var(--danger-soft);
    --error-border: #efc9c4;
    --error-text: var(--danger);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --canvas: #0e0e10;
    --surface: #17171a;
    --surface-muted: #1f1f23;
    --surface-sunken: #28282d;
    --ink: #f4f2ed;
    --ink-2: #b2afa7;
    --ink-3: #7e7b74;
    --hairline: #2a2a2f;
    --hairline-strong: #3a3a40;
    --accent: #a79bff;
    --accent-ink: #14121f;
    --accent-soft: #241f3d;
    --user-bubble: #5b4be8;
    --user-text: #ffffff;
    --ai-bubble: #1a1a1e;
    --danger: #ff6b5e;
    --danger-soft: #2b1618;
    --success: #57d68a;
    --warning: #f0c05a;
    --code-bg: #131317;
    --code-border: #2a2a2f;
    --link: #a79bff;
    --quote-border: #3a3a40;
    --quote-text: #9a968e;
    --hover: rgba(255, 255, 255, .06);
    --ring: 0 0 0 3px rgba(167, 155, 255, .2);
    --error-border: #4a2a2e;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; height: 100dvh; display: flex; flex-direction: column;
    background: var(--canvas);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  svg.icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }

  /* ---------- 顶栏 ---------- */
  header {
    display: flex; align-items: center; gap: 1rem;
    padding: 0 max(1rem, calc((100vw - 1040px) / 2));
    height: 60px; flex: 0 0 auto;
    background: var(--surface);
    border-bottom: 1px solid var(--hairline);
    position: sticky; top: 0; z-index: 5;
  }
  /* 品牌块不参与收缩：被挤扁时名字会截断、「在线」会竖着折两行盖在一起 */
  .brand { display: flex; align-items: center; gap: .7rem; min-width: 0; flex: 0 0 auto; }
  .avatar-wrap {
    position: relative; width: 36px; height: 36px; flex: 0 0 auto;
    border-radius: 50%; overflow: hidden; background: var(--surface-muted);
    display: flex; align-items: center; justify-content: center;
  }
  .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #avatarFallback { font-size: 1.1rem; line-height: 1; }
  .brand-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; overflow: hidden; }
  header h1 {
    font-size: 16px; margin: 0; font-weight: 600; letter-spacing: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .status { display: inline-flex; align-items: center; gap: .35rem; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
  .status .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--success);
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }

  /* 空间不够时先压缩这排信息并允许横向滑动，而不是把品牌块挤到只剩一个字 */
  .meta { display: flex; align-items: center; gap: 0; flex-wrap: nowrap; flex: 0 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .meta::-webkit-scrollbar { display: none; }
  .chip {
    font-size: 12px; color: var(--ink-3);
    background: none; border: none; padding: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 40ch;
  }
  .chip + .chip::before { content: "·"; margin: 0 .5rem; color: var(--hairline-strong); }
  .chip:empty { display: none; }
  #usageInfo, #balanceInfo { cursor: pointer; }
  #usageInfo:hover, #balanceInfo:hover { color: var(--ink); }

  .actions { display: flex; align-items: center; gap: .15rem; margin-left: auto; flex: 0 0 auto; }
  .actions button, .actions a {
    display: inline-flex; align-items: center; gap: .4rem;
    background: transparent; border: 1px solid transparent; color: var(--ink-2);
    border-radius: 10px; padding: .4rem .55rem; cursor: pointer;
    font: inherit; font-size: 12.5px; line-height: 1;
    transition: background .15s ease, color .15s ease;
    touch-action: manipulation; white-space: nowrap; text-decoration: none;
  }
  .actions button:hover, .actions a:hover { background: var(--hover); color: var(--ink); }
  .actions button:active { transform: scale(.97); }
  .actions svg.icon { width: 17px; height: 17px; }
  #logout { color: var(--ink-3); }
  @media (max-width: 900px) {
    .actions .label { display: none; }
    .actions button, .actions a { padding: .45rem; }
  }

  /* 窄一点时顶栏折成两行：第一行品牌 + 操作，第二行日期/费用/余额，避免全挤成省略号 */
  @media (max-width: 1100px) {
    header {
      flex-wrap: wrap; height: auto; row-gap: .15rem;
      padding-top: .5rem; padding-bottom: .5rem;
    }
    .brand { order: 1; }
    .actions { order: 2; margin-left: auto; }
    .meta {
      order: 3; flex-basis: 100%;
      overflow-x: auto; scrollbar-width: none;
    }
    .meta::-webkit-scrollbar { display: none; }
  }

  /* ---------- 消息区 ---------- */
  #messages {
    flex: 1; overflow-y: auto;
    padding: 22px max(1rem, calc((100vw - var(--col)) / 2)) 18px;
    display: flex; flex-direction: column;
    overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
    scrollbar-width: thin; scrollbar-color: var(--hairline-strong) transparent;
  }
  #messages::-webkit-scrollbar { width: 10px; }
  #messages::-webkit-scrollbar-thumb { background: var(--hairline-strong); border-radius: 6px; border: 3px solid var(--canvas); }
  #messages::-webkit-scrollbar-track { background: transparent; }

  .msg {
    display: flex; gap: .6rem; align-items: flex-start;
    max-width: 100%; width: 100%;
    margin-top: 16px;
    animation: rise .22s ease both;
  }
  .msg:first-child { margin-top: 0; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .msg.user { flex-direction: row-reverse; }
  .msg-avatar {
    width: 30px; height: 30px; border-radius: 50%; flex: 0 0 auto; margin-top: 2px;
    background: var(--surface-muted); overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: .85rem;
  }
  .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .msg.user .msg-avatar { display: none; }
  .msg-body { display: flex; flex-direction: column; min-width: 0; max-width: 74%; }
  .msg.user .msg-body { align-items: flex-end; max-width: 74%; }

  /* 同一人连续说话：贴紧，头像只留第一行 */
  .msg.assistant + .msg.assistant { margin-top: 4px; }
  .msg.assistant + .msg.assistant .msg-avatar { visibility: hidden; }
  /* 只有每组第一条留小角，后面的气泡回到全圆角 */
  .msg.assistant + .msg.assistant .bubble { border-top-left-radius: 18px; }
  .msg.user + .msg.user .bubble { border-top-right-radius: 18px; }
  .msg.user + .msg.user { margin-top: 4px; }

  .bubble {
    padding: 11px 15px; border-radius: 18px;
    line-height: 1.72; font-size: 15px;
    white-space: normal; overflow-wrap: anywhere;
    box-shadow: none;
  }
  .msg.assistant .bubble {
    background: var(--ai-bubble); color: var(--ink);
    border: 1px solid var(--hairline);
    border-top-left-radius: 6px;
  }
  .msg.user .bubble {
    background: var(--user-bubble); color: var(--user-text);
    border: none;
    border-top-right-radius: 6px;
  }
  .msg.error .bubble {
    background: var(--danger-soft); border: 1px solid var(--error-border); color: var(--danger);
    border-top-left-radius: 6px;
  }

  .msg-file {
    display: flex; align-items: center; gap: .4rem;
    width: fit-content; max-width: 100%;
    margin-top: .5rem; font-size: .82rem; color: var(--ink-2);
    background: var(--surface-muted); border: 1px solid var(--hairline);
    border-radius: 12px; padding: .4rem .7rem;
    overflow-wrap: anywhere; word-break: break-word;
  }
  .msg.user .msg-file { border-color: rgba(255, 255, 255, .28); background: rgba(255, 255, 255, .12); color: #fff; }
  a.msg-file { text-decoration: none; }
  a.msg-file:hover { border-color: var(--hairline-strong); }
  .msg-file svg { width: 14px; height: 14px; flex: 0 0 auto; opacity: .75; }
  /* 链接卡片：封面在左、标题两行截断、来源单独一行——纯文字卡片认不出是哪条视频 */
  .meta-card { padding: .45rem; gap: .6rem; align-items: stretch; max-width: min(340px, 100%); }
  .meta-cover { width: 96px; height: 60px; object-fit: cover; border-radius: 8px; flex: 0 0 auto; background: rgba(0,0,0,.06); }
  .meta-body { display: flex; flex-direction: column; gap: .15rem; min-width: 0; justify-content: center; }
  .meta-title {
    font-weight: 600; color: var(--ink); line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .msg.user .meta-title { color: #fff; }
  .meta-src { font-size: .68rem; color: var(--ink-3); letter-spacing: .02em; }
  .msg.user .meta-src, .msg.user .meta-sub { color: rgba(255,255,255,.72); }
  .msg-file .meta-sub { color: var(--ink-3); font-size: .74rem; }
  .msg.user .msg-file .meta-sub { color: rgba(255, 255, 255, .75); }

  .typing { color: var(--ink-3); font-size: .9rem; }
  .typing .dot { display: inline-block; animation: typing-blink 1.4s infinite; }
  @keyframes typing-blink {
    0%, 60%, 100% { opacity: .25; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-2px); }
  }

  .bubble p { margin: .42em 0; }
  .bubble p:first-child { margin-top: 0; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble pre {
    background: var(--code-bg); border: 1px solid var(--code-border); border-radius: 12px;
    padding: .8em .95em; overflow-x: auto; font-size: .84rem; line-height: 1.6;
  }
  .bubble code { background: var(--code-bg); border-radius: 6px; padding: .12em .38em; font-size: .87em; }
  .bubble pre code { background: none; padding: 0; }
  .bubble blockquote { border-left: 2px solid var(--quote-border); margin: .5em 0; padding-left: .9em; color: var(--quote-text); }
  .bubble a { color: var(--link); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--link) 32%, transparent); }
  .bubble a:hover { border-bottom-color: var(--link); }
  .bubble h1, .bubble h2, .bubble h3, .bubble h4 { font-size: 1em; margin: .7em 0 .3em; font-weight: 650; }
  .bubble hr { border: none; border-top: 1px solid var(--hairline); margin: .8em 0; }
  .bubble img.msg-img { max-width: 100%; max-height: 320px; border-radius: 12px; margin-top: .55rem; display: block; object-fit: contain; }
  .msg-audio { width: min(100%, 320px); height: 34px; margin-top: .45rem; display: block; }
  .msg-video { max-width: 100%; max-height: 360px; margin-top: .55rem; display: block; border-radius: 12px; background: #000; }
  .img-missing {
    display: inline-block; font-size: .78rem; color: var(--ink-3);
    background: var(--surface-muted); border: 1px dashed var(--hairline-strong);
    padding: .12rem .5rem; border-radius: 8px; margin-top: .3rem;
  }

  /* 费用/复制这类元信息默认不占版面，悬停才浮出来，长对话不被小字打断 */
  .msg-body { position: relative; }
  .msg-foot {
    position: absolute; left: 2px; top: 100%; margin-top: 3px;
    display: flex; align-items: center; gap: .5rem; padding: 0 .15rem;
    opacity: 0; pointer-events: none; transition: opacity .15s ease;
  }
  .msg.user .msg-foot { left: auto; right: 2px; }
  .msg:hover .msg-foot, .msg:focus-within .msg-foot { opacity: 1; pointer-events: auto; }
  .cost-tag { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .copy-btn, .voice-btn {
    background: none; border: none; color: var(--ink-3); font: inherit; font-size: 11px;
    cursor: pointer; padding: .1rem .3rem; border-radius: 6px;
    opacity: 0; transition: opacity .15s ease, background .15s ease, color .15s ease;
  }
  .msg:hover .copy-btn, .msg:hover .voice-btn, .copy-btn:focus-visible, .voice-btn:focus-visible { opacity: 1; }
  .copy-btn:hover, .voice-btn:hover { color: var(--ink); background: var(--hover); }
  .voice-btn.speaking { opacity: 1; color: var(--accent-ink); background: var(--accent); }

  .voice-card {
    display: flex; align-items: center; gap: .55rem; flex-wrap: wrap;
    margin: .55rem 0; padding: .5rem .65rem;
    border: 1px solid var(--hairline); border-radius: 14px; background: var(--surface-muted);
  }
  .voice-tag { font-size: .72rem; color: var(--accent); white-space: nowrap; }
  .voice-text { flex: 1; min-width: 120px; font-size: .82rem; color: var(--ink-2); }
  .voice-segment-play {
    background: var(--surface); border: 1px solid var(--hairline); color: var(--ink-2);
    font: inherit; font-size: .72rem; cursor: pointer; padding: .2rem .5rem; border-radius: 8px;
  }
  .voice-segment-play:hover { background: var(--hover); color: var(--ink); }
  .voice-segment-play.speaking { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
  .voice-audio { width: min(100%, 260px); height: 32px; }

  /* ---------- 输入区 ---------- */
  #composer {
    padding: 12px max(1rem, calc((100vw - var(--col)) / 2)) calc(14px + env(safe-area-inset-bottom, 0px));
    background: var(--surface);
    border-top: 1px solid var(--hairline);
    flex: 0 0 auto;
  }
  .composer-inner {
    display: flex; gap: .5rem; max-width: var(--col); margin: 0 auto; align-items: flex-end;
  }
  #preview {
    max-width: var(--col); margin: 0 auto .6rem; display: flex; gap: .5rem; align-items: flex-start;
  }
  #preview img { max-height: 110px; max-width: 40vw; border-radius: 12px; border: 1px solid var(--hairline); }
  #removeImg, #removeFile {
    border: 1px solid var(--hairline); background: var(--surface); color: var(--ink-2);
    border-radius: 50%; width: 26px; height: 26px; cursor: pointer; line-height: 1; flex: 0 0 auto;
    transition: background .15s ease;
  }
  #removeImg:hover, #removeFile:hover { background: var(--hover); }

  #filePreview {
    max-width: var(--col); margin: 0 auto .6rem; display: flex; gap: .5rem; align-items: center;
  }
  #filePreviewName {
    font-size: .86rem; color: var(--ink-2); background: var(--surface-muted);
    border: 1px solid var(--hairline); border-radius: 12px; padding: .45rem .8rem;
    max-width: 70vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  #pickImage, #pickFile {
    border: 1px solid transparent; background: var(--surface-muted); color: var(--ink-2);
    border-radius: 50%; width: 42px; height: 42px; cursor: pointer;
    flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
    touch-action: manipulation;
  }
  #pickImage:hover, #pickFile:hover { background: var(--surface-sunken); color: var(--ink); }
  #pickImage:active, #pickFile:active { transform: scale(.96); }
  #pickImage svg.icon, #pickFile svg.icon { width: 19px; height: 19px; }

  #input {
    flex: 1; resize: none; min-height: 42px; max-height: 12rem; padding: 10px 16px;
    background: var(--surface-muted); color: var(--ink);
    border: 1px solid transparent; border-radius: 21px;
    font: inherit; font-size: 15px; line-height: 1.55; outline: none;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  #input::placeholder { color: var(--ink-2); opacity: .85; }
  #input:focus { background: var(--surface); border-color: var(--hairline-strong); box-shadow: var(--ring); }

  #send {
    border: none; background: var(--accent); color: var(--accent-ink);
    border-radius: 50%; width: 42px; height: 42px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex: 0 0 auto;
    transition: filter .15s ease, transform .1s ease, background .15s ease;
    touch-action: manipulation;
  }
  #send svg.icon { width: 20px; height: 20px; stroke-width: 2; }
  #send:hover:not(:disabled) { filter: brightness(1.08); }
  #send:active:not(:disabled) { transform: scale(.96); }
  #send:disabled { background: var(--surface-muted); color: var(--ink-3); cursor: not-allowed; }

  /* ---------- 登录 ---------- */
  #login {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--canvas); z-index: 20; padding: 1rem;
  }
  #login .card {
    background: var(--surface); border: 1px solid var(--hairline); border-radius: 24px;
    padding: 2.2rem 1.9rem; width: min(92vw, 340px); box-shadow: none;
    text-align: center;
  }
  #login .card .avatar-wrap { width: 56px; height: 56px; margin: 0 auto .9rem; font-size: 1.6rem; }
  #login h2 { margin: 0 0 1.4rem; font-size: 16px; font-weight: 500; color: var(--ink-2); letter-spacing: 0; }
  #password {
    width: 100%; padding: .7rem .9rem; background: var(--surface-muted); color: var(--ink);
    border: 1px solid transparent; border-radius: 14px; font: inherit; font-size: 15px; outline: none;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  #password:focus { background: var(--surface); border-color: var(--hairline-strong); box-shadow: var(--ring); }
  #loginBtn {
    width: 100%; margin-top: .9rem; padding: .72rem; background: var(--accent); color: var(--accent-ink);
    border: none; border-radius: 14px; cursor: pointer; font: inherit; font-weight: 600; font-size: 15px;
    transition: filter .15s ease, transform .1s ease;
    touch-action: manipulation;
  }
  #loginBtn:hover { filter: brightness(1.08); }
  #loginBtn:active { transform: scale(.99); }
  #loginError { color: var(--danger); font-size: .82rem; min-height: 1.2em; margin-top: .65rem; }
  /* ---------- 配对码 ---------- */
  #pairModal {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--canvas) 84%, transparent);
    backdrop-filter: blur(6px); z-index: 30; padding: 1rem;
  }
  #pairModal .card {
    background: var(--surface); border: 1px solid var(--hairline); border-radius: 24px;
    padding: 1.6rem 1.5rem; width: min(92vw, 380px); text-align: left; box-shadow: none;
  }
  #pairModal h2 { margin: 0 0 .4rem; font-size: 16px; font-weight: 600; color: var(--ink); }
  #pairModal .hint { margin: 0 0 1rem; font-size: .82rem; line-height: 1.65; color: var(--ink-3); }
  #pairCode {
    width: 100%; padding: .7rem .9rem; background: var(--surface-muted); color: var(--ink);
    border: 1px solid transparent; border-radius: 14px; font: inherit; font-size: 15px;

  }
  #pairCode:focus { background: var(--surface); border-color: var(--hairline-strong); box-shadow: var(--ring); }
  #pairModal .row { display: flex; gap: .5rem; margin-top: .8rem; }

    flex: 1; padding: .64rem; border-radius: 12px; border: 1px solid var(--hairline-strong);

  #pairMsg { min-height: 1.2em; font-size: .8rem; color: var(--ink-3); margin-top: .5rem; line-height: 1.5; }
  .hidden { display: none !important; }

  /* ---------- 手机端 ---------- */
  @media (max-width: 680px) {
    header { flex-wrap: wrap; height: auto; gap: .45rem .6rem; padding: .55rem .8rem; }
    .avatar-wrap { width: 32px; height: 32px; }

</head>
<body>

    <div class="actions">
      <button id="themeBtn" title="切换主题（跟随系统 / 深色 / 浅色）"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg></button>
      <button id="setCity" title="修改天气城市"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg><span class="label">城市</span></button>
      <a id="diaryLink" href="/diary.html" title="看她的日记（要她同意）"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h11a1 1 0 0 1 1 1v15l-6.5-3.2L5 20V5a1 1 0 0 1 1-1z"/><path d="M9 9h6M9 13h4"/></svg><span class="label">日记</span></a>
      <a id="changesLink" href="/changes" title="看过往每次改动和原因"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 6H20M8.5 12H20M8.5 18H20"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg><span class="label">记录</span></a>
      <button id="runDaily" title="立即归档昨天并提炼记忆"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12l1-8.5z"/></svg><span class="label">归档</span></button>
      <button id="pairBtn" title="设置 App 配对码"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="3.2"/><path d="m10.6 10.6 6.4 6.4M14.5 12.7 16.5 10.7l2 2"/></svg><span class="label">配对</span></button>

  <main id="messages"></main>

    <div class="composer-inner">
      <button id="pickImage" type="button" title="发送图片" aria-label="发送图片"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="m4 17 4.5-4 3.5 3.5L15 13l5 4.5"/></svg></button>
      <button id="pickFile" type="button" title="发送文件" aria-label="发送文件"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg></button>
      <textarea id="input" rows="1" placeholder="说点什么…"></textarea>

    <input id="fileInput" type="file" accept="image/*" hidden />

  </footer>

  <div id="login">
    <div class="card">

             onerror="this.style.display='none';document.getElementById('loginAvatarFallback').style.display='flex'" />
        <span id="loginAvatarFallback" style="display:none">🐟</span>
      </div>
      <h2>输入口令，和小忆聊天</h2>

<div id="pairModal" class="hidden">
    <div class="card">
      <h2>App 配对码</h2>
      <p class="hint">在 App 的配对页输入这个码，就能配一台设备。改完立刻生效，不用重新部署。</p>
      <form id="pairForm">
        <input id="pairCode" maxlength="32" autocomplete="off" spellcheck="false" placeholder="8~32 位字母或数字" />
        <div class="row">
          <button type="button" id="pairRandom">随机生成</button>
          <button type="submit" id="pairSave" class="primary">保存</button>
        </div>
        <div class="foot">
          <button type="button" id="pairClear">清除，回退默认</button>
          <button type="button" id="pairClose">关闭</button>
        </div>
        <div id="pairMsg"></div>
      </form>
    </div>
  </div>

  <script>
const $ = (id) => document.getElementById(id);
const messagesEl = $('messages');
// 语音卡里的单段播放按钮走事件委托：流式重绘后按钮也不会丢监听
messagesEl.addEventListener('click', async (event) => {
  const btn = event.target.closest('.voice-segment-play');
  if (!btn || btn.disabled) return;
  const bubble = btn.closest('.bubble');
  let voices = [];
  try { voices = JSON.parse(bubble && bubble.dataset.voices || '[]'); } catch { voices = []; }
  const text = voices[Number(btn.dataset.index)];
  if (!text) return;
  // 历史语音没有存好的 R2 key：点播放时再走一次手机/MeloTTS 队列
  btn.disabled = true;
  const label = btn.dataset.label || '▶ 播放';
  btn.textContent = '生成中…';
  const key = await fetchTtsKey(text);
  if (key) {
    const audio = document.createElement('audio');
    audio.className = 'voice-audio';
    audio.controls = true;
    audio.preload = 'metadata';
    audio.src = '/api/audio/' + key;
    btn.replaceWith(audio);
    return;
  }
  btn.disabled = false;
  btn.textContent = label;
  speakVoice([text], btn);
});

/* ---------- 主题（跟随系统 / 深色 / 浅色，默认跟随系统） ---------- */
const THEME_KEY = 'ds-memory-theme';
const themeBtn = $('themeBtn');
const currentThemeMode = () => localStorage.getItem(THEME_KEY) || 'system';
const resolveTheme = (mode) =>
  mode === 'dark' ? 'dark'
  : mode === 'light' ? 'light'
  : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
const THEME_ICONS = {
  system: '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg>',
  dark: '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  light: '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
};
const THEME_TITLES = { system: '主题：跟随系统', dark: '主题：深色', light: '主题：浅色' };
function applyTheme(mode) {
  document.documentElement.dataset.theme = resolveTheme(mode);
  themeBtn.innerHTML = THEME_ICONS[mode] || THEME_ICONS.system;
  themeBtn.title = THEME_TITLES[mode] || '切换主题';
  localStorage.setItem(THEME_KEY, mode);
}
themeBtn.addEventListener('click', () => {
  const next = { system: 'dark', dark: 'light', light: 'system' }[currentThemeMode()] || 'system';
  applyTheme(next);
});
applyTheme(currentThemeMode());
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (currentThemeMode() === 'system') applyTheme('system');
});

/* ---------- 基础工具 ---------- */
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
// 模型偶尔模仿历史时间标签（[10-30 09:47] / [09:47]）。服务端已清洗是主防线，
// 这里兜第二层：旧消息、缓存、非流式回放都可能带着它，界面上不该显示。
const LEAD_TIME_RE = /^\s*[\[【]\s*(?:(?:\d{2,4}[-/])?\d{1,2}[-/]\d{1,2}\s*)?\d{1,2}:\d{2}(?::\d{2})?\s*[\]】]\s*/;
function stripLeadTime(text) {
  let s = String(text || '');
  for (let i = 0; i < 3; i++) {
    const next = s.replace(LEAD_TIME_RE, '');
    if (next === s) break;
    s = next;
  }
  return s;
}
function inline(s) {
  return s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}
/* ---------- 网页语音播放（浏览器 TTS） ---------- */
const VOICE_TEXT_PATTERNS = [
  /[\[【［]\s*(?:语音消息|语音|voice)\s*[\]】］]\s*[「“]([^」”]*)[」”]/gi,
  /[（(]\s*[【\[]\s*语音消息\s*[】\]]\s*发送\s*[：:]\s*([^）)\n]+)[）)]/gi,
  /[【\[]\s*语音消息\s*[】\]]\s*发送\s*[：:]\s*([^\n）)]+)/gi,
  /[【\[]\s*语音(?:消息)?\s*[】\]]\s*(?!(?:发送\s*[：:]|[「“]))([^\n]+)/gi,
  /^（语音）\s*(.+)$/gm,
];
function extractVoiceTexts(src) {
  const text = String(src || '');
  const found = [];
  for (const re of VOICE_TEXT_PATTERNS) {
    re.lastIndex = 0;
    let m;
    while ((m = re.exec(text))) {
      const t = (m[1] || '').trim();
      if (t) found.push(t);
    }
  }
  return [...new Set(found)];
}
function voiceTone(text) {
  let rate = 1;
  let pitch = 1;
  if (/[！!]/.test(text)) { rate += 0.08; pitch += 0.06; }
  if (/[？?]/.test(text)) { rate += 0.03; pitch += 0.08; }
  if (/……|\.\.\./.test(text)) { rate -= 0.08; }
  if (/[～~]/.test(text)) { pitch += 0.04; }
  return {
    rate: Math.max(0.75, Math.min(1.3, rate)),
    pitch: Math.max(0.8, Math.min(1.25, pitch)),
  };
}
function pickChineseVoice() {
  if (!window.speechSynthesis) return null;
  const voices = window.speechSynthesis.getVoices() || [];
  return voices.find((v) => /zh[-_]?CN|Chinese|Xiaoxiao|Yunxi|Huihui|Xiaoyi/i.test(`${v.lang} ${v.name}`))
    || voices.find((v) => /^zh/i.test(v.lang))
    || null;
}
function resetVoiceButton(btn) {
  if (!btn) return;
  btn.classList.remove('speaking');
  btn.textContent = btn.dataset.label || '🔊 朗读';
}
function cleanSpeakText(src) {
  return String(src || '')
    .replace(/```[\s\S]*?```/g, '')
    .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
    .replace(/\[face[:：][^\]]{1,12}\]/gi, '')
    .replace(/\[(?:图片|文件|语音|voice)[^\]]*\]/gi, '')
    .replace(/[（(][^（）()]{0,80}[）)]/g, '')
    .replace(/[#*_>`~]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}
function stopVoice(btn) {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  document.querySelectorAll('.voice-btn.speaking, .voice-segment-play.speaking').forEach(resetVoiceButton);
  resetVoiceButton(btn);
}
function speakVoice(texts, btn) {
  if (!texts.length) return;
  if (!('speechSynthesis' in window)) {
    alert('当前浏览器不支持语音播放，请换 Chrome/Edge/Safari 试试');
    return;
  }
  if (btn.classList.contains('speaking')) { stopVoice(btn); return; }
  window.speechSynthesis.cancel();
  document.querySelectorAll('.voice-btn.speaking, .voice-segment-play.speaking').forEach(resetVoiceButton);
  btn.classList.add('speaking');
  btn.textContent = '⏹ 停止';
  const voice = pickChineseVoice();
  const utterances = texts.map((text, idx) => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    if (voice) u.voice = voice;
    const tone = voiceTone(text);
    u.rate = tone.rate;
    u.pitch = tone.pitch;
    if (idx === texts.length - 1) {
      u.onend = () => resetVoiceButton(btn);
      u.onerror = () => resetVoiceButton(btn);
    }
    return u;
  });
  utterances.forEach((u) => window.speechSynthesis.speak(u));
}
const VOICE_BLOCK_RE = /(?:[\[【［]\s*(?:语音消息|语音|voice)\s*[\]】］]\s*[「“]([^」”]*)(?:[」”]|$))|(?:[（(]\s*[【\[［]\s*语音消息\s*[】\]］]\s*发送\s*[：:]\s*([^）)\n]+)[）)])|(?:[【\[［]\s*语音消息\s*[】\]］]\s*发送\s*[：:]\s*([^\n）)]+))|(?:[【\[［]\s*语音(?:消息)?\s*[】\]］]\s*(?!(?:发送\s*[：:]|[「“]))([^\n]+))|(?:^（语音）\s*(.+)$)/gmi;
const ttsBlobCache = new Map();
function voiceCardHtml(text, index, audioKey) {
  // 服务端合成时我们已经把音频读成 blob，直接用 blob URL，点击不用再等网络
  const directUrl = audioKey ? ttsBlobCache.get(audioKey) : '';
  const play = audioKey
    ? '<audio class="voice-audio" controls preload="metadata" src="' + (directUrl || '/api/audio/' + audioKey) + '"></audio>'
    : '<button type="button" class="voice-segment-play" data-index="' + index + '" data-label="▶ 播放">▶ 播放</button>';
  return '<div class="voice-card">'
    + '<span class="voice-tag">🎤 语音</span>'
    + '<span class="voice-text">' + escapeHtml(text) + '</span>'
    + play
    + '</div>';
}
function renderAssistantContent(raw, audioKeys = []) {
  const src = stripLeadTime(String(raw || ''));
  const voices = [];
  let html = '';
  let last = 0;
  let m;
  VOICE_BLOCK_RE.lastIndex = 0;
  while ((m = VOICE_BLOCK_RE.exec(src))) {
    const before = src.slice(last, m.index);
    if (before.trim()) html += renderMarkdown(before);
    const spoken = cleanSpeakText(m[1] || m[2] || m[3] || m[4] || m[5] || '');
    if (spoken) {
      html += voiceCardHtml(spoken, voices.length, audioKeys[voices.length] || '');
      voices.push(spoken);
    }
    last = m.index + m[0].length;
  }
  if (!voices.length) return { html: renderMarkdown(src), voices: [] };
  const rest = src.slice(last);
  if (rest.trim()) html += renderMarkdown(rest);
  return { html, voices };
}
function sleep(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}
async function fetchTtsKey(text) {
  // 首选：服务端用云端配置（= App 的 Azure 音色）直接合成，带上 R2 缓存。
  // 手机不在线、或者没响应，也能拿到和 App 一样的声音。
  try {
    const direct = await fetch('/api/tts/speak', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (direct.ok) {
      const key = direct.headers.get('x-tts-key') || '';
      if (key) {
        // 顺带把音频读掉，浏览器缓存住，点击时几乎瞬时
        const blob = await direct.blob();
        const url = URL.createObjectURL(blob);
        ttsBlobCache.set(key, url);
      }
      if (key) return key;
    }
  } catch { /* 落到下面的手机合成 */ }
  // 兜底：原有链路（手机合成 → R2），手机不在线再走 MeloTTS
  try {
    const create = await fetch('/api/tts', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (!create.ok) return '';
    const created = await create.json();
    const jobId = Number(created.job_id || 0);
    if (!jobId) return '';
    const deadline = Date.now() + 8000;
    while (Date.now() < deadline) {
      await sleep(500);
      const res = await fetch('/api/tts/jobs/' + jobId);
      if (!res.ok) return '';
      const job = await res.json();
      if (job.status === 'done' && typeof job.audio_key === 'string' && job.audio_key) {
        return job.audio_key;
      }
      if (job.status === 'failed') break;
    }
    // 手机 8 秒内没完成/不在线 → Worker MeloTTS 兜底
    const fb = await fetch('/api/tts/jobs/' + jobId + '/fallback', { method: 'POST' });
    if (!fb.ok) return '';
    const data = await fb.json();
    return typeof data.audio_key === 'string' ? data.audio_key : '';
  } catch {
    return '';
  }
}
async function finalizeAssistantBubble(bubble) {
  if (!bubble) return;
  const raw = bubble.dataset.raw || '';
  if (!raw) return;
  const parsed = renderAssistantContent(raw);
  bubble.innerHTML = parsed.html;
  bubble.dataset.voices = JSON.stringify(parsed.voices);
  if (parsed.voices.length) {
    // 手机 TTS 优先；超时由 /fallback 用 MeloTTS 生成；失败保留浏览器朗读按钮
    const keys = await Promise.all(parsed.voices.map((text) => fetchTtsKey(text)));
    if (keys.some(Boolean)) {
      const withAudio = renderAssistantContent(raw, keys);
      bubble.innerHTML = withAudio.html;
      bubble.dataset.voices = JSON.stringify(withAudio.voices);
    }
  }
  refreshVoiceButton(bubble);
}

function speakTextsForBubble(bubble) {
  const raw = bubble.dataset.raw || '';
  const voices = extractVoiceTexts(raw).map(cleanSpeakText).filter(Boolean);
  if (voices.length) return voices;
  const plain = cleanSpeakText(raw);
  return plain ? [plain] : [];
}
function refreshVoiceButton(bubble) {
  if (!bubble) return;
  const body = bubble.closest('.msg-body');
  const foot = body && body.querySelector('.msg-foot');
  if (!foot) return;
  let btn = foot.querySelector('.voice-btn');
  const texts = speakTextsForBubble(bubble);
  if (!texts.length) {
    if (btn) btn.remove();
    return;
  }
  if (!btn) {
    btn = document.createElement('button');
    btn.className = 'voice-btn';
    btn.type = 'button';
    btn.dataset.label = '🔊 朗读';
    btn.textContent = '🔊 朗读';

function renderMarkdown(src) {
  const blocks = [];
  // 语音标记不直接暴露给用户：显示成 🎤 + 原话，标点保留
  src = String(src || '')
    .replace(/^（语音）/, '🎤 ')
    .replace(/[\[【［]\s*(?:语音消息|语音|voice)\s*[\]】］]\s*[「“]([^」”]*)[」”]/gi, '🎤 $1')
    .replace(/[（(]\s*[【\[]\s*语音消息\s*[】\]]\s*发送\s*[：:]\s*([^）)\n]+)[）)]/gi, '🎤 $1')
    .replace(/[【\[]\s*语音消息\s*[】\]]\s*发送\s*[：:]\s*([^\n）)]+)/gi, '🎤 $1')
    .replace(/[【\[]\s*语音(?:消息)?\s*[】\]]\s*(?!(?:发送\s*[：:]|[「“]))/gi, '🎤 ');
  let s = escapeHtml(src);
  s = s.replace(/```([\s\S]*?)```/g, (_, code) => {
    blocks.push('<pre><code>' + code.trim() + '</code></pre>');
    return '\u0000' + (blocks.length - 1) + '\u0000';
  });
  const out = [];
  let para = [];
  const flush = () => { if (para.length) { out.push('<p>' + para.join('<br>') + '</p>'); para = []; } };
  for (const rawLine of s.split('\n')) {
    const t = rawLine.trim();
    if (/^\u0000\d+\u0000$/.test(t)) { flush(); out.push(t); continue; }
    let m;
    if ((m = t.match(/^(#{1,4})\s+(.*)$/))) { flush(); out.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'); continue; }
    if ((m = t.match(/^&gt;\s?(.*)$/))) { flush(); out.push('<blockquote>' + inline(m[1]) + '</blockquote>'); continue; }
    if (/^[-*]\s+/.test(t)) { flush(); out.push('<p>• ' + inline(t.replace(/^[-*]\s+/, '')) + '</p>'); continue; }
    if (/^(---|\*\*\*|\* \* \*)$/.test(t)) { flush(); out.push('<hr>'); continue; }
    if (t === '') { flush(); continue; }
    para.push(inline(t));
  }
  flush();
  s = out.join('\n');
  s = s.replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[+i]);
  return s;
}

      av.style.color = '#fff';
    }
  };

  const body = document.createElement('div');
  body.className = 'msg-body';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

    const parsed = renderAssistantContent(raw);
    bubble.innerHTML = parsed.html;
    bubble.dataset.voices = JSON.stringify(parsed.voices);
  }
  body.appendChild(bubble);

  const foot = document.createElement('div');
  foot.className = 'msg-foot';

  btn.className = 'copy-btn';

      await navigator.clipboard.writeText(text);

      setTimeout(() => { btn.textContent = '复制'; }, 1500);

  if (role !== 'user') queueMicrotask(() => refreshVoiceButton(bubble));
  return wrap;

/* 用户消息渲染：处理 [图片:images/…] 标记与换行；无路径的 [图片] 显示占位提示 */
function renderUserContent(content) {
  content = stripLeadTime(content);
  // 老消息里留过内部说明（视频帧提示）——那是给模型看的，气泡里不该露出来。
  content = content
    .replace(/[（(][^（）()]{0,40}左上角标着时间[）)]\s*/g, '')
    .replace(/\[视频帧\]/g, '')
    .trim();
  // 落库内容里包含文件原文（给 AI 读），历史渲染只显示文件卡片；
  // 否则刷新后整个文件正文会铺满聊天气泡。
  const fileCards = [];
  let hadMetaCard = false;
  const pushCard = (name) => {
    const token = `\u0000DSFILE${fileCards.length}\u0000`;
    fileCards.push(`<div class="msg-file"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>${escapeHtml(name)}</div>`);
    return token;
  };
  // 链接资料块（B站/网页）：正文是给 AI 读的元数据，界面上只留一张小卡片，
  // 否则整段 Markdown 会铺满气泡（App 早就这么做了，网页之前是原样展开）。
  const metaCard = (body, kind) => {
    hadMetaCard = true;
    const pick = (key) => (body.match(new RegExp('^\\s*[-*]\\s*' + key + '\\s*[:：]\\s*(.+)$', 'm')) || [])[1];
    const title = (pick('标题') || '').trim();
    const sub = [pick('UP主') || pick('来源'), pick('时长')].map((s) => (s || '').trim()).filter(Boolean).join(' · ');
    const link = (pick('链接') || '').trim();
    const cover = (pick('封面') || '').trim();
    const label = title || (kind === 'video' ? 'B站视频' : '网页');
    const href = /^https?:\/\//.test(link) ? ' href="' + escapeHtml(link) + '" target="_blank" rel="noopener noreferrer"' : '';
    const token = `\u0000DSFILE${fileCards.length}\u0000`;
    // 有封面就出图，没有就退回纯文字卡片——绝不显示空白框
    const thumb = /^https?:\/\//.test(cover)
      ? '<img class="meta-cover" src="' + escapeHtml(cover) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">'
      : '';
    fileCards.push(
      '<a class="msg-file meta-card"' + href + '>' + thumb +
      '<span class="meta-body"><span class="meta-title">' + escapeHtml(label) + '</span>' +
      (sub ? '<span class="meta-sub">' + escapeHtml(sub) + '</span>' : '') +
      (kind === 'video' ? '<span class="meta-src">哔哩哔哩</span>' : '') +
      '</span></a>',
    );
    return token;
  };
  content = content.replace(/\[BILI_META\]([\s\S]*?)\[\/BILI_META\]/gi, (_a, body) => metaCard(body, 'video'));
  // 网页端发链接没有 meta（Worker 出口被 B 站 412 挡住，拿不到标题/封面），
  // 至少把它渲染成一张认得出是 B 站视频的卡片，而不是一行裸 URL。
  content = content.replace(
    /https?:\/\/(?:www\.)?bilibili\.com\/video\/(BV[0-9A-Za-z]{10}|av\d+)[^\s，。！？]*/gi,
    (url, id) => {
      hadMetaCard = true;
      const token = `\u0000DSFILE${fileCards.length}\u0000`;
      const icon = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9.5 5 2.5-5 2.5z"/></svg>';
      fileCards.push(
        '<a class="msg-file meta-card" href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer">' +
          '<span class="meta-body"><span class="meta-title">B站视频</span>' +
          '<span class="meta-sub">' + escapeHtml(id) + '</span>' +
          '<span class="meta-src">哔哩哔哩</span></span></a>',
      );
      return token;
    },
  );
  content = content.replace(/\[WEB_META\]([\s\S]*?)\[\/WEB_META\]/gi, (_a, body) => metaCard(body, 'web'));
  // App 端格式（2026-10-30 起带结束标记）：[文件:name|size|mime] + 【文件内容】 + 正文 + 【/文件】
  content = content.replace(/\[文件:([^|\]]+)\|[^\]]*]\s*\n?【文件内容】\n[\s\S]*?【\/文件】/g, (_a, name) => pushCard(name));
  // App 端旧消息没有结束标记：文件块总在消息末尾，吃到结尾才对。
  content = content.replace(/\[文件:([^|\]]+)\|[^\]]*]\s*\n?【文件内容】\n[\s\S]*$/g, (_a, name) => pushCard(name));
  // 新格式带结束标记：文件正文里本身就有 ``` 代码块，靠围栏配对一定会截断在第一个代码块。
  content = content.replace(/【文件：([^】]+)】[^\n]*\n[\s\S]*?【\/文件】/g, (_a, name) => pushCard(name));
  // 旧格式（已落库的消息）：文件块总在消息末尾，贪婪吃到最后一个 ``` 才对。
  content = content.replace(/【文件：([^】]+)】\s*\n?```[^\n]*\n[\s\S]*\n```/g, (_a, name) => pushCard(name));
  // 分享进来的链接是「【标题-哔哩哔哩】 + 短链 + 自己的话」拼成一行：
  // 标题和链接已经由上面的卡片承载，气泡里只留自己打的那句（与手机端一致）。
  if (hadMetaCard) {
    content = content
      .replace(/^\s*【[^】]{0,90}(?:哔哩哔哩|bilibili)[^】]{0,10}】\s*/i, '')
      .replace(/https?:\/\/[A-Za-z0-9\-._~:/?#\[\]@!%&'()*+,;=]+/g, '')
      .replace(/[ \t]{2,}/g, ' ')
      .replace(/\n{3,}/g, '\n\n')
      .trim();
  }
  const re = /\[(图片|语音|GIF|视频):((?:images|diary-images|audio|gifs|videos)\/[^\]\s]+)\]/g;
  let html = '';
  let last = 0;
  let m;
  while ((m = re.exec(content))) {
    html += escapeHtml(content.slice(last, m.index));
    if (m[1] === '图片' || m[1] === 'GIF') {
      html += '<img class="msg-img" src="/api/image/' + m[2] + '" alt="图片" loading="lazy"'
            + ' onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{className:\'img-missing\',textContent:\'[图片加载失败]\'}))">';
    } else if (m[1] === '视频') {
      // 以前视频落进了下面的 audio 分支：src 指向 /api/audio/，加载失败就是个空气泡。
      html += '<video class="msg-video" controls preload="metadata" playsinline src="/api/image/' + m[2] + '"'
            + ' onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{className:\'img-missing\',textContent:\'[视频加载失败]\'}))"></video>';
    } else {
      html += '<audio class="msg-audio" controls preload="metadata" src="/api/audio/' + m[2] + '"></audio>';
    }
    last = m.index + m[0].length;
  }
  html += escapeHtml(content.slice(last));
  // 占位符在整体转义后还原成卡片，避免 <div> 被 escapeHtml 转成文字。
  // 卡片是块级元素且自带 margin-top，前面残留的换行会变成一行空行——一起吃掉。
  fileCards.forEach((card, i) => {
    html = html.replace(new RegExp(`\\s*\u0000DSFILE${i}\u0000`), card);
  });
  // 兼容旧记录：只有 [图片] 没有 R2 路径时，显示灰色提示而不是裸露的方括号文字
  html = html.replace(/\[图片\]/g, '<span class="img-missing">[图片未存档]</span>');
  return html.replace(/\n/g, '<br>');
}

function locateAndSetCity() {
  if (!navigator.geolocation) {
    alert('当前浏览器不支持定位，请改用手动输入');
    return;
  }
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const { latitude, longitude } = pos.coords;
      let cityName = '当前位置';
      try {
        const g = await fetch(
          `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=zh`,
        );
        const gd = await g.json();
        cityName = gd.city || gd.locality || gd.principalSubdivision || '当前位置';
      } catch { /* 反查失败则直接用坐标保存 */ }
      await saveCity({ city: cityName, latitude, longitude });
    },
    (err) => {
      alert('定位失败：' + (err && err.message ? err.message : '用户拒绝或超时'));
    },
    { timeout: 15000, maximumAge: 300000 },
  );
}

  alert('最近 7 天费用明细（含今日）\n' + (lines.length ? lines.join('\n') : '（暂无数据）'));

/* ---------- 历史全量回放（分页 + 上滑自动加载；记录在 D1，跨浏览器同步） ---------- */
let nextBefore = null;
let hasMore = false;
let loadingHistory = false;
/** 当前页面已渲染的最大消息 id（实时轮询的游标） */
let latestSeenId = 0;

async function fetchHistoryPage(beforeId) {
  const res = await fetch('/api/history?limit=50' + (beforeId ? `&before_id=${beforeId}` : ''));
  if (res.status === 401) { showLogin(); return null; }
  return res.json();
}

async function loadMoreHistory(jumpToBottom) {
  if (loadingHistory) return;
  loadingHistory = true;
  try {
    const data = await fetchHistoryPage(nextBefore);
    if (!data) return;
    nextBefore = data.next_before_id ?? null;
    hasMore = data.has_more ?? false;
    const frag = document.createDocumentFragment();
    for (const m of data.messages || []) {
      // 单条渲染失败不能让整段历史变空白（2026-10-31 就踩过一次）
      try {
        frag.appendChild(buildBubbleEl(
          m.role === 'user' ? 'user' : 'assistant',
          m.role === 'user' ? renderUserContent(m.content) : renderMarkdown(stripLeadTime(m.content)),
          m.content,
        ));
      } catch (e) {
        console.warn('skip history message', m && m.id, e);
      }
      if (Number.isFinite(m.id) && m.id > latestSeenId) latestSeenId = m.id;
    }
    const prevHeight = messagesEl.scrollHeight;
    messagesEl.prepend(frag);
    if (jumpToBottom) {
      messagesEl.scrollTop = messagesEl.scrollHeight; // 首次加载定位到最新
    } else {
      messagesEl.scrollTop += messagesEl.scrollHeight - prevHeight; // 上滑加载保持视口不跳
    }
  } catch { /* 网络异常忽略，可继续滚动重试 */ }
  finally {
    loadingHistory = false;
  }
}

async function resetAndLoadHistory() {
  messagesEl.innerHTML = '';
  nextBefore = null;
  hasMore = false;
  latestSeenId = 0;
  await loadMoreHistory(true);
}

/* ---------- 实时刷新：定时增量拉取（让 QQ / 其它渠道的消息即时出现）---------- */
const POLL_INTERVAL_MS = 5000;
let pollTimer = null;
let pollingNow = false;
let sending = false;

async function pollNewMessages() {
  if (pollingNow) return;
  // 正在发消息/流式中：这一轮还没拿到真实 id，拉取会把刚发出的两条再渲染一遍
  if (sending) return;
  if (document.visibilityState === 'hidden') return; // 后台标签页不轮询
  pollingNow = true;
  try {
    // 按 has_more 补齐，避免离线/切后台期间积压超过一页时漏消息
    const nearBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 120;
    let appended = false;
    for (let batch = 0; batch < 10; batch++) {
      const res = await fetch(`/api/history/since?after_id=${latestSeenId}&limit=50`, { cache: 'no-store' });
      if (res.status === 401) { stopPolling(); showLogin(); return; }
      if (!res.ok) break;
      const data = await res.json();
      const incoming = (data.messages || []).filter((m) => Number.isFinite(m.id) && m.id > latestSeenId);
      if (incoming.length === 0) break;

      // 先推进游标，避免重复渲染
      for (const m of incoming) {
        if (m.id > latestSeenId) latestSeenId = m.id;
      }

      for (const m of incoming) {
        try {
          messagesEl.appendChild(buildBubbleEl(
            m.role === 'user' ? 'user' : 'assistant',
            m.role === 'user' ? renderUserContent(m.content) : renderMarkdown(stripLeadTime(m.content)),
            m.content,
          ));
        } catch (e) {
          console.warn('skip live message', m && m.id, e);
        }
      }
      appended = true;
      if (!data.has_more) break;
    }
    if (appended && nearBottom) scrollToBottom();
  } catch { /* 网络抖动忽略，下次再试 */ }
  finally {
    pollingNow = false;
  }
}

function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(pollNewMessages, POLL_INTERVAL_MS);
}

function stopPolling() {
  if (!pollTimer) return;
  clearInterval(pollTimer);
  pollTimer = null;
}

// 可见时恢复轮询并立即补拉；后台标签页完全停止，不占请求。
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    startPolling();
    pollNewMessages();
  } else {
    stopPolling();
  }
});

messagesEl.addEventListener('scroll', () => {
  if (messagesEl.scrollTop < 300 && hasMore && !loadingHistory) loadMoreHistory(false);
});

/* ---------- 发送与流式接收 ---------- */
const input = $('input');
$('send').addEventListener('click', send);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';

/* ---------- 图片发送 ---------- */
const fileInput = $('fileInput');
let pendingImage = null; // 压缩后的 data URL

$('pickImage').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async () => {

/* ---------- 文件发送（纯文本类：读内容给 AI 看） ---------- */
const docInput = $('docInput');
let pendingFile = null; // { name, text }

$('pickFile').addEventListener('click', () => docInput.click());
docInput.addEventListener('change', async () => {
  const file = docInput.files && docInput.files[0];
  docInput.value = '';
  if (!file) return;
  // 先显示"解析中"，避免大文件解析时界面无反馈
  $('filePreviewName').textContent = '⏳ 正在解析 ' + file.name + ' …';
  $('filePreview').classList.remove('hidden');
  try {
    const text = await extractFileText(file);
    if (!text || !text.trim()) {
      throw new Error('没有从文件里提取到文字内容');
    }
    if (text.length > 18000) {
      pendingFile = { name: file.name, text: text.slice(0, 18000) };
      $('filePreviewName').textContent =
        '📄 ' + file.name + '（已截断至 18000 字，原 ' + text.length + ' 字）';
    } else {
      pendingFile = { name: file.name, text };
      $('filePreviewName').textContent = '📄 ' + file.name + '（' + text.length + ' 字）';
    }
    $('filePreview').classList.remove('hidden');
  } catch (e) {
    pendingFile = null;
    $('filePreview').classList.add('hidden');
    $('filePreviewName').textContent = '';
    alert('文件解析失败：' + (e && e.message ? e.message : e));
  }
});
$('removeFile').addEventListener('click', () => {
  pendingFile = null;
  $('filePreview').classList.add('hidden');
  $('filePreviewName').textContent = '';
});

function readFileAsText(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result || ''));
    r.onerror = () => reject(new Error('读取文件失败'));
    r.readAsText(file, 'UTF-8');
  });
}

/* ---------- 文件解析（按需动态加载解析库，正常聊天不受影响） ---------- */

const LEGACY_OFFICE_EXT = ['.doc', '.xls', '.ppt'];

function extOf(name) {
  const i = String(name || '').lastIndexOf('.');
  return i < 0 ? '' : String(name).slice(i).toLowerCase();
}

/** 动态加载外部脚本，同一个 URL 只加载一次；支持多个候选源自动回退，返回成功加载的 URL。 */
const _scriptCache = {};
function loadScript(urls) {
  const list = Array.isArray(urls) ? urls : [urls];
  const key = list[0];
  if (_scriptCache[key]) return _scriptCache[key];
  const tryLoad = (i) => {
    if (i >= list.length) {
      return Promise.reject(new Error('解析库加载失败（网络/CDN 问题），可改用 QQ 端发这个文件'));
    }
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = list[i];
      s.async = true;
      s.onload = () => resolve(list[i]);
      s.onerror = () => reject(new Error('fail'));
      document.head.appendChild(s);
    }).catch(() => tryLoad(i + 1));
  };
  _scriptCache[key] = tryLoad(0);
  return _scriptCache[key];
}

const CDN = {
  pdf: [
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',
    'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js',
  ],
  mammoth: [
    'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js',
    'https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js',
  ],
  xlsx: [
    'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
    'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js',
  ],
  jszip: [
    'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',
    'https://unpkg.com/jszip@3.10.1/dist/jszip.min.js',
  ],
};

/** PDF：逐页提取文字（最多 40 页，防超长）。 */
async function parsePdf(file) {
  const loadedUrl = await loadScript(CDN.pdf);
  const pdfjs = window.pdfjsLib;
  if (!pdfjs) throw new Error('PDF 解析库未就绪');
  // worker 与主库同源，避免跨域/源失效
  pdfjs.GlobalWorkerOptions.workerSrc = String(loadedUrl).replace(/pdf\.min\.js$/, 'pdf.worker.min.js');
  const buf = await file.arrayBuffer();
  const pdf = await pdfjs.getDocument({ data: buf }).promise;
  const parts = [];
  const maxPages = Math.min(pdf.numPages, 40);
  for (let i = 1; i <= maxPages; i++) {
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    const t = tc.items.map((x) => x.str).join(' ').replace(/\s+/g, ' ').trim();
    if (t) parts.push('## 第 ' + i + ' 页\n' + t);
    if (parts.join('\n').length > 30000) { parts.push('…（页数较多，已截断）'); break; }
  }
  if (pdf.numPages > maxPages) parts.push('…（共 ' + pdf.numPages + ' 页，只解析了前 ' + maxPages + ' 页）');
  if (!parts.length) throw new Error('PDF 里没有可提取的文字（可能是扫描件/图片型 PDF）');
  return parts.join('\n\n');
}

/** Word(.docx)：提取纯文本（含表格会转成普通文本行）。 */
async function parseDocx(file) {
  await loadScript(CDN.mammoth);
  if (!window.mammoth) throw new Error('Word 解析库未就绪');
  const buf = await file.arrayBuffer();
  const res = await window.mammoth.extractRawText({ arrayBuffer: buf });
  return String(res.value || '').trim();
}

/** Excel(.xlsx)：每个工作表转 CSV 文本。 */
async function parseXlsx(file) {
  await loadScript(CDN.xlsx);
  const XLSX = window.XLSX;
  if (!XLSX) throw new Error('Excel 解析库未就绪');
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array' });
  const parts = [];
  for (const name of wb.SheetNames) {
    const ws = wb.Sheets[name];
    const csv = XLSX.utils.sheet_to_csv(ws, { blankrows: false });
    if (csv && csv.trim()) parts.push('## 工作表：' + name + '\n' + csv.trim());
  }
  if (!parts.length) throw new Error('Excel 表格里没有数据');
  return parts.join('\n\n');
}

/** PPT(.pptx)：解压 zip，从每页 XML 里抽 <a:t> 文本。 */
async function parsePptx(file) {
  await loadScript(CDN.jszip);
  const JSZip = window.JSZip;
  if (!JSZip) throw new Error('PPT 解析库未就绪');
  const buf = await file.arrayBuffer();
  const zip = await JSZip.loadAsync(buf);
  const slideNames = Object.keys(zip.files)
    .filter((n) => /^ppt\/slides\/slide\d+\.xml$/.test(n))
    .sort((a, b) => {
      const na = Number((a.match(/slide(\d+)/) || [])[1] || 0);
      const nb = Number((b.match(/slide(\d+)/) || [])[1] || 0);
      return na - nb;
    });
  if (!slideNames.length) throw new Error('PPT 结构异常，没找到幻灯片');
  const decodeXml = (s) =>
    String(s)
      .replace(/&lt;/g, '<').replace(/&gt;/g, '>')
      .replace(/&quot;/g, '"').replace(/&apos;/g, "'")
      .replace(/&amp;/g, '&');
  const parts = [];
  for (let i = 0; i < slideNames.length; i++) {
    const xml = await zip.file(slideNames[i]).async('string');
    const texts = [];
    const re = /<a:t>([\s\S]*?)<\/a:t>/g;
    let m;
    while ((m = re.exec(xml)) !== null) {
      const t = decodeXml(m[1]).trim();
      if (t) texts.push(t);
    }
    if (texts.length) parts.push('## 第 ' + (i + 1) + ' 页\n' + texts.join('\n'));
  }
  if (!parts.length) throw new Error('PPT 里没有文字内容');
  return parts.join('\n\n');
}

/** 统一入口：按扩展名分派解析方式。 */
async function extractFileText(file) {
  const ext = extOf(file.name);
  if (LEGACY_OFFICE_EXT.includes(ext)) {
    throw new Error('旧版 Office 格式（' + ext + '）暂不支持，请在 Office/WPS 里另存为 ' + ext + 'x 后再传');
  }
  if (ext === '.pdf') return await parsePdf(file);
  if (ext === '.docx') return await parseDocx(file);
  if (ext === '.xlsx') return await parseXlsx(file);
  if (ext === '.pptx') return await parsePptx(file);
  // 其余按纯文本读
  const text = await readFileAsText(file);
  if (text.indexOf('\u0000') !== -1) throw new Error('看起来是二进制文件，不支持直接读取');
  return text;
}

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error('读取文件失败'));
    r.readAsDataURL(file);
  });
}

/** 压缩图片：最长边 1024px、JPEG 0.72，尽可能压小（R2 存储省空间、上传更快）。 */
async function compressImage(file) {
  const dataUrl = await readFileAsDataUrl(file);
  const img = await new Promise((resolve, reject) => {
    const i = new Image();
    i.onload = () => resolve(i);
    i.onerror = () => reject(new Error('图片解析失败'));
    i.src = dataUrl;
  });
  const maxSide = 1024;
  let { width, height } = img;
  if (Math.max(width, height) > maxSide) {
    const k = maxSide / Math.max(width, height);
    width = Math.round(width * k);
    height = Math.round(height * k);
  }
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  canvas.getContext('2d').drawImage(img, 0, 0, width, height);
  return canvas.toDataURL('image/jpeg', 0.72);
}

async function send() {
  const content = input.value.trim();
  const image = pendingImage;
  const file = pendingFile;
  if ((!content && !image && !file) || sending) return;
  sending = true;
  $('send').disabled = true;
  input.value = '';
  input.style.height = 'auto';
  if (image) {
    pendingImage = null;
    $('preview').classList.add('hidden');
    $('previewImg').src = '';
  }
  if (file) {
    pendingFile = null;
    $('filePreview').classList.add('hidden');
    $('filePreviewName').textContent = '';
  }

  // 文件内容拼成一段「文件原文」，让 AI 能读到；图片仍走视觉
  let sendContent = content;
  if (file) {
    // 结束标记必须有：文件正文里的 ``` 会让「靠围栏配对」的解析提前收尾，
    // 剩下的正文就当成聊天内容显示出来了。
    const fileBlock = `【文件：${file.name}】\n\`\`\`\n${file.text}\n\`\`\`\n【/文件】`;
    sendContent = content ? `${content}\n\n${fileBlock}` : fileBlock;
  }

  const userHtml = escapeHtml(content)
    + (image ? `<img class="msg-img" src="${image}" alt="图片">` : '')
    + (file ? `<div class="msg-file"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>${escapeHtml(file.name)}</div>` : '');
  addBubble('user', userHtml, sendContent + (image ? '\n[图片]' : ''));
  // ★ 活人感：先显示"正在输入…"，再开始流式，模拟思考停顿
  let bubble = addBubble('assistant', '<span class="typing">正在输入<span class="dot">…</span></span>', '');
  let text = '';
  let noReply = false;
  let firstToken = false; // 是否已收到首字
  let frame = 0;
  // ★ 阅读+反应时延：按消息长度估算"它看完要多久"，让首字不闪现，更像它在想
  const thinkMs = Math.min(1800, 400 + sendContent.length * 30);
  const thinkDoneAt = Date.now() + thinkMs;
  const repaint = () => {
    if (frame) return;
    frame = requestAnimationFrame(() => {
      frame = 0;
      // 服务端已清洗是主防线；这里再兜一层，防止流式首帧被切开时漏出来
      bubble.innerHTML = renderMarkdown(stripLeadTime(text)) || (firstToken ? '' : '<span class="typing">正在输入<span class="dot">…</span></span>');
      bubble.dataset.raw = text;
      refreshVoiceButton(bubble);
      scrollToBottom();
    });
  };

  try {
    const res = await fetch('/api/chat', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify(image ? { content: sendContent, image } : { content: sendContent }),
    });
    if (res.status === 401) { showLogin(); throw new Error('登录已过期'); }
        // 她在忙/睡着：消息已经落库，回复由服务端到点补发。
    // 不显示"大概几点会看"这类提示——那是系统在说话，不是她。
    if ((res.headers.get('content-type') || '').includes('application/json')) {
      const data = await res.json().catch(() => ({}));
      if (data && data.held) {
        bubble.remove();
        return;
      }
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop() || '';
      for (const line of lines) {
        const t = line.trim();
        if (!t.startsWith('data:')) continue;
        const payload = t.slice(5).trim();
        if (!payload) continue;
        if (payload === '[DONE]') continue;
        try {
          const parsed = JSON.parse(payload);
          if (parsed.event === 'usage') {
            // ★ 推进轮询游标：这一轮已经由流式渲染过了，否则 3 秒后的增量拉取会重复渲染
            if (parsed.ids) {
              const id = Number(parsed.ids.assistant || parsed.ids.user || 0);
              if (Number.isFinite(id) && id > latestSeenId) latestSeenId = id;
            }
            const tag = document.createElement('span');
            tag.className = 'cost-tag';
            tag.textContent = '≈¥' + Number(parsed.cost_rmb || 0).toFixed(4);
            const foot = bubble.parentElement.querySelector('.msg-foot');
            foot.insertBefore(tag, foot.firstChild);
            loadUsage();
            continue;
          }
          const delta = parsed.choices && parsed.choices[0] && parsed.choices[0].delta;
          if (delta && typeof delta.content === 'string') {
            firstToken = true;
            text += delta.content;
            if (text.includes('[END]')) {
              // 只有纯标记才代表不回；正文+标记说明它其实已经决定要说话。
              text = text.replace(/\[END\]/g, '');
              if (!text.trim()) noReply = true;
            }
            if (noReply) continue;
            // 首字前若有"思考停顿"，等够时间再刷出，否则直接刷
            if (Date.now() >= thinkDoneAt) {
              repaint();
            } else {
              clearTimeout(window.__typingTimer);
              window.__typingTimer = setTimeout(repaint, thinkDoneAt - Date.now());
            }
          }
        } catch { /* 忽略 */ }
      }
    }
    if (noReply && !text.trim()) {
      const row = bubble.closest('.msg');
      if (row) row.remove();
    }
  } catch (err) {
    bubble.className = 'bubble';
    bubble.parentElement.parentElement.className = 'msg error';
    bubble.innerHTML = '⚠️ ' + escapeHtml(String(err.message || err));
  } finally {
    sending = false;
    $('send').disabled = false;
    input.focus();
    // 流结束后把语音段从正文里拆出来，按“文字 → 语音卡 → 文字”重排
    if (!bubble.parentElement?.parentElement?.classList.contains('error')) {
      finalizeAssistantBubble(bubble);
    }
    // 流结束后补一次拉取，兼顾这期间从 QQ 发来的消息
    pollNewMessages();
  }
}

/* ---------- 会话恢复：有有效 Cookie（24 小时内）自动免登录 ---------- */
async function initSession() {
  try {
    const res = await fetch('/api/history?limit=5');
    if (res.ok) {
      hideLogin();
      await loadDay();
      await resetAndLoadHistory();
      loadUsage();
      loadBalance();
      startPolling();
      input.focus();
      return;
    }
  } catch { /* 网络异常按未登录处理 */ }
  showLogin();
}
initSession();
