<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>修改记录</title>
<link rel="icon" type="image/png" sizes="64x64" href="/icon-64.png" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0e0e10" media="(prefers-color-scheme: dark)" />
<script>
  // 与聊天页共用同一个主题键，进来不会闪
  (function () {
    var m = localStorage.getItem('ds-memory-theme') || 'system';
    document.documentElement.dataset.theme = m === 'dark' ? 'dark'
      : m === 'light' ? 'light'
      : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --canvas: #f7f6f3; --surface: #ffffff; --surface-muted: #f1f0eb;
    --ink: #17171a; --ink-2: #5e5b54; --ink-3: #706c63;
    --hairline: #e6e3dc; --hairline-strong: #d8d4ca;
    --accent: #4b3fd1; --accent-soft: #edeafb; --accent-ink: #fff;
    --hover: rgba(23, 23, 26, .05);
    --ring: 0 0 0 3px rgba(75, 63, 209, .16);
    --feat: #1b7a4b; --fix: #b3261e; --docs: #2f5d8a; --other: #706c63; --deploy: #4b3fd1;
    /* 旧变量名兼容 */
    --bg: var(--canvas); --panel: var(--surface); --text: var(--ink);
    --text-soft: var(--ink-2); --muted: var(--ink-3); --border: var(--hairline);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --canvas: #0e0e10; --surface: #17171a; --surface-muted: #1f1f23;
    --ink: #f4f2ed; --ink-2: #b2afa7; --ink-3: #7e7b74;
    --hairline: #2a2a2f; --hairline-strong: #3a3a40;
    --accent: #a79bff; --accent-soft: #241f3d; --accent-ink: #14121f;
    --hover: rgba(255, 255, 255, .06);
    --ring: 0 0 0 3px rgba(167, 155, 255, .2);
    --feat: #57d68a; --fix: #ff8a7a; --docs: #8fb8e8; --other: #9a968e; --deploy: #a79bff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--canvas); color: var(--ink);
    font: 15px/1.7 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  svg.icon { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  header {
    position: sticky; top: 0; z-index: 9;
    background: var(--surface); border-bottom: 1px solid var(--hairline);
  }
  .bar { max-width: 820px; margin: 0 auto; padding: .75rem 1rem; display: flex; align-items: center; gap: .6rem; }
  .bar h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: 0; }
  .bar .count { color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }
  .bar .spacer { flex: 1; }
  .bar a, .bar button {
    display: inline-flex; align-items: center; gap: .35rem;
    background: transparent; border: 1px solid transparent; color: var(--ink-2);
    border-radius: 10px; padding: .38rem .55rem; font: inherit; font-size: 13px;
    cursor: pointer; text-decoration: none; white-space: nowrap; line-height: 1;
    transition: background .15s ease, color .15s ease;
  }
  .bar a:hover, .bar button:hover { background: var(--hover); color: var(--ink); }

  .tools { max-width: 820px; margin: 0 auto; padding: 1rem 1rem 0; display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
  .tools input {
    flex: 1 1 240px; min-width: 0; background: var(--surface-muted); color: var(--ink);
    border: 1px solid transparent; border-radius: 14px; padding: .55rem .85rem;
    font: inherit; font-size: 14px; outline: none;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .tools input::placeholder { color: var(--ink-3); }
  .tools input:focus { background: var(--surface); border-color: var(--hairline-strong); box-shadow: var(--ring); }

  .chips { display: flex; gap: .3rem; flex-wrap: wrap; }
  .chips button {
    background: transparent; border: 1px solid transparent; color: var(--ink-2);
    border-radius: 10px; padding: .3rem .55rem; font: inherit; font-size: 12.5px; cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .chips button:hover { background: var(--hover); color: var(--ink); }
  .chips button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  main { max-width: 820px; margin: 0 auto; padding: .5rem 1rem 1rem; }
  .day { margin: 1.6rem 0 0; }
  .day h2 {
    font-size: 12px; color: var(--ink-3); font-weight: 600; margin: 0 0 .5rem;
    letter-spacing: .04em; display: flex; align-items: center; gap: .6rem;
  }
  .day h2::after { content: ""; flex: 1; height: 1px; background: var(--hairline); }

  .card {
    background: var(--surface); border: 1px solid var(--hairline); border-radius: 16px;
    padding: .8rem .95rem; margin-bottom: .55rem;
    transition: border-color .15s ease;
  }
  .card:hover { border-color: var(--hairline-strong); }
  .card .head { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: .06rem .4rem; border-radius: 6px; border: 1px solid currentColor; line-height: 1.5; }
  .badge.feat { color: var(--feat); } .badge.fix { color: var(--fix); }
  .badge.docs { color: var(--docs); } .badge.other { color: var(--other); }
  .badge.deploy { color: var(--deploy); font-weight: 600; }
  .card .area { color: var(--ink-3); font-size: 12px; }
  .card .hash { color: var(--ink-3); font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin-left: auto; }
  .card .title { margin: .45rem 0 0; font-size: 15px; color: var(--ink); }
  .card .why { margin: .4rem 0 0; color: var(--ink-2); font-size: 13.5px; display: none; white-space: pre-wrap; }
  .card.open .why { display: block; }
  .card .toggle { background: none; border: 0; color: var(--ink-3); font: inherit; font-size: 12px; cursor: pointer; padding: 0; margin-top: .45rem; }
  .card .toggle:hover { color: var(--accent); }
  .empty { color: var(--ink-3); text-align: center; padding: 3rem 0; font-size: 14px; }
  footer { color: var(--ink-3); text-align: center; font-size: 12px; padding: 2rem 1rem 3rem; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>修改记录</h1>
    <span class="count" id="count"></span>
    <span class="spacer"></span>
    <a href="/">← 回聊天</a>
    <button id="themeBtn" title="切换主题"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg></button>
  </div>
</header>

<div class="tools">
  <input id="q" type="search" placeholder="搜索改动内容 / 原因 / 提交号…" autocomplete="off" />
  <div class="chips" id="chips"></div>
</div>

<main id="list"><div class="empty">加载中…</div></main>
<footer id="foot"></footer>

<script>
const TYPE_LABEL = { deploy: '上线', feat: '新功能', fix: '修复', docs: '文档', refactor: '重构', perf: '性能', test: '测试', chore: '杂务', other: '其他' };
const $ = (id) => document.getElementById(id);
let all = [];
let activeType = 'all';
let keyword = '';

/* 主题：与聊天页同一个 key，循环 跟随系统 → 深色 → 浅色 */
const THEME_KEY = 'ds-memory-theme';
const THEME_ICONS = {
  system: '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg>',
  dark: '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  light: '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
};
const mode = () => localStorage.getItem(THEME_KEY) || 'system';
const resolve = (m) => m === 'dark' ? 'dark' : m === 'light' ? 'light'
  : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
function applyTheme(m) {
  document.documentElement.dataset.theme = resolve(m);
  $('themeBtn').innerHTML = THEME_ICONS[m] || THEME_ICONS.system;
  localStorage.setItem(THEME_KEY, m);
}
$('themeBtn').addEventListener('click', () => {
  const next = { system: 'dark', dark: 'light', light: 'system' }[mode()] || 'system';
  applyTheme(next);
});
applyTheme(mode());

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function load() {
  try {
    const res = await fetch('changelog.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    all = (data.days || []).flatMap((d) => d.items || []);
    $('foot').textContent = '共 ' + (data.count ?? all.length) + ' 条改动 · 生成于 ' + (data.generated_at || '').slice(0, 16).replace('T', ' ');
    renderChips();
    render();
  } catch (e) {
    $('list').innerHTML = '<div class="empty">读取 changelog.json 失败：' + esc(e.message) + '</div>';
  }
}

function renderChips() {
  const types = ['all', ...new Set(all.map((i) => i.type))];
  $('chips').innerHTML = types.map((t) =>
    '<button data-type="' + t + '" aria-pressed="' + (t === activeType) + '">' +
    (t === 'all' ? '全部' : (TYPE_LABEL[t] || t)) + '</button>').join('');
  $('chips').querySelectorAll('button').forEach((b) => {
    b.addEventListener('click', () => { activeType = b.dataset.type; renderChips(); render(); });
  });
}

function matches(item) {
  if (activeType !== 'all' && item.type !== activeType) return false;
  if (!keyword) return true;
  const hay = (item.title + ' ' + item.why + ' ' + item.area + ' ' + item.hash).toLowerCase();
  return hay.includes(keyword);
}

function render() {
  const items = all.filter(matches);
  $('count').textContent = items.length + ' / ' + all.length;
  if (items.length === 0) { $('list').innerHTML = '<div class="empty">没有匹配的改动</div>'; return; }
  const days = [];
  const idx = new Map();
  for (const it of items) {
    if (!idx.has(it.date)) { const d = { date: it.date, items: [] }; idx.set(it.date, d); days.push(d); }
    idx.get(it.date).items.push(it);
  }
  $('list').innerHTML = days.map((d) =>
    '<section class="day"><h2>' + esc(d.date) + ' · ' + d.items.length + ' 条</h2>' +
    d.items.map((it) =>
      '<article class="card">' +
      '<div class="head">' +
      '<span class="badge ' + esc(it.type) + '">' + esc(TYPE_LABEL[it.type] || it.type) + '</span>' +
      (it.area ? '<span class="area">' + esc(it.area) + '</span>' : '') +
      '<span class="hash">' + esc(it.hash) + '</span>' +
      '</div>' +
      '<p class="title">' + esc(it.title) + '</p>' +
      (it.why ? '<p class="why">' + esc(it.why) + '</p><button class="toggle">展开原因</button>' : '') +
      '</article>').join('') +
    '</section>').join('');
  $('list').querySelectorAll('.toggle').forEach((btn) => {
    btn.addEventListener('click', () => {
      const card = btn.closest('.card');
      card.classList.toggle('open');
      btn.textContent = card.classList.contains('open') ? '收起' : '展开原因';
    });
  });
}

$('q').addEventListener('input', (e) => { keyword = e.target.value.trim().toLowerCase(); render(); });
load();
</script>
</body>
</html>
