# DeepSeek 长期记忆代理 · Cloudflare Worker 配置
#
# 部署前要做的三件事：
#   1. 填入你的 Cloudflare account_id（或用环境变量 CLOUDFLARE_ACCOUNT_ID）
#   2. 创建 D1 / R2 / KV 三个资源，把下面的 REPLACE_ME 换成真实 id
#   3. wrangler secret put DEEPSEEK_API_KEY / ACCESS_PASSWORD_HASH

name = "ds-memory"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# 你的 Cloudflare 账号 ID：wrangler whoami 可查。
# 留空时 wrangler 会用登录态里的默认账号，本地开发更方便。
# account_id = "REPLACE_ME"

[observability]
enabled = true

[vars]
# 天气定位（改成你所在的城市；经纬度用于 Open-Meteo）
CITY = "北京"
LATITUDE = "39.9042"
LONGITUDE = "116.4074"

# 对话模型
DEEPSEEK_MODEL = "deepseek-flash"

# memory.md 维护阈值（字节）：>12KB 触发全量提炼，仍 >15KB 删最旧
MEMORY_REFRESH_BYTES = "12288"
MEMORY_TRIM_BYTES = "15360"

# Workers AI 兜底模型（提炼失败/情绪复核使用）
DISTILL_MODEL = "@cf/meta/llama-3.2-3b-instruct"
# 提炼模型分工：每日提炼与压缩用 v4-pro（质量），滚动摘要用 flash（成本）
DISTILL_DEEPSEEK_MODEL = "deepseek-v4-pro"
SUMMARY_DEEPSEEK_MODEL = "deepseek-flash"

# DeepSeek 计费单价（高峰时段，元/百万 tokens；闲时自动减半）
# deepseek-flash：0.04 / 2.0 / 8.0（切回 v4-pro 请改 0.30 / 9.0 / 27.0）
PRICE_INPUT_HIT_PEAK = "0.04"
PRICE_INPUT_MISS_PEAK = "2.0"
PRICE_OUTPUT_PEAK = "8.0"

# 小号 R2 容量阈值（字节）：主账号占用达到后新写入自动切小号（默认 8.5GB）
STORAGE_THRESHOLD_BYTES = "9126805504"

# 主动消息强度：quiet（少说）/ normal（正常）/ active（活跃）
PROACTIVE_LEVEL = "normal"

# ── 角色身份（可选）──────────────────────────────────────────
# 不填则用开源默认值：角色名「小忆」、按记忆自然称呼对方。
# 想换成自己的设定就填这两项，**不用改源码**：
#   CHARACTER_NAME = "阿七"
#   USER_ADDRESS   = "主人"   # 换成你想被叫的称呼
# 它们会同时影响系统提示词、角色状态卡和网页标题。

# 主动消息（AstrBot HTTP API）：AstrBot 的公网地址与会话 UMO；留空则走队列模式
# UMO 形如 default_1234567890:FriendMessage:ABCDEF...
ASTRBOT_BASE_URL = ""
ASTRBOT_UMO = ""

[[d1_databases]]
binding = "DB"
database_name = "ds-memory-db"
database_id = "REPLACE_ME"

[[r2_buckets]]
binding = "R2"
bucket_name = "ds-memory-r2"

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_ME"

[ai]
binding = "AI"

[assets]
directory = "./public"
binding = "ASSETS"
# 让 Worker 先接管首页，才能对 HTML 注入 CHARACTER_NAME（角色名）。
# 其余静态文件（图片等）仍由 CDN 直出，不经过 Worker。
run_worker_first = ["/", "/index.html"]

[triggers]
# Cloudflare 免费版限制 3 个 cron 触发器，所以合并成 3 条、在代码里分发：
# 1) 每日 04:00（UTC 20:00）归档 + 每月 1 日同一分钟跑月度合并
# 2) 每 5 分钟：白天随机主动消息（北京 09:00–22:30）+ UTC 8 点 context 刷新
# 3) 每 5 分钟：早晚固定主动消息 + UTC 0/16 点 context 刷新
crons = [
  "0 20 * * *",
  "*/5 1-14 * * *",
  "*/5 23,0,14,15,16 * * *",
]
